# ─────────────────────────────────────────────────────────
#  Profil PROD — produkcja
#  Uruchomienie: --spring.profiles.active=prod
#  WSZYSTKIE wartości przez zmienne środowiskowe serwera!
# ─────────────────────────────────────────────────────────

spring.datasource.url=${DB_URL_PROD}
spring.datasource.username=${DB_USERNAME_PROD}
spring.datasource.password=${DB_PASSWORD_PROD}

jwt.secret=${JWT_SECRET_PROD}
jwt.expiration=${JWT_EXPIRATION_PROD:3600000}

spring.jpa.show-sql=false
spring.flyway.clean-disabled=true


logging.level.com.personalfinance=INFO
logging.level.org.springframework=WARN

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
