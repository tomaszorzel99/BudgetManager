# Profil PROD. Uruchomienie: --spring.profiles.active=prod
# Wymagane zmienne: DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, CORS_ALLOWED_ORIGINS
# DB_URL w prod musi zawierać sslMode=REQUIRED

server.forward-headers-strategy=framework

spring.jpa.show-sql=false
logging.level.com.personalfinance=INFO
logging.level.org.springframework=WARN

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
