spring.application.name=BudgetManager

# --- Baza danych: wartości WYŁĄCZNIE ze zmiennych środowiskowych (bez domyślnych) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/Migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# --- CORS: lista originów po przecinku; pusto = żaden obcy origin ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# --- Błędy: nic wewnętrznego nie wychodzi do klienta ---
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never

# --- Swagger domyślnie wyłączony (włączany tylko w dev) ---
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- Plik logów tylko gdy ustawisz LOG_FILE ---
logging.file.name=${LOG_FILE:}