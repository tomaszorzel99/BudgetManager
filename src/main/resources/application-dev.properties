# Profil DEV - tylko lokalnie. Sekrety w pliku .env (NIE commitować).
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/BudgetManager?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&zeroDateTimeBehavior=CONVERT_TO_NULL}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

logging.file.name=${LOG_FILE:logs/budget-manager.log}
logging.level.com.personalfinance=DEBUG
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

server.error.include-message=always
server.error.include-binding-errors=always