spring.datasource.url=${DB_URL_DEV:jdbc:mysql://localhost:3306/BudgetManager?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&zeroDateTimeBehavior=CONVERT_TO_NULL}
spring.datasource.username=${DB_USERNAME_DEV:root}
spring.datasource.password=${DB_PASSWORD_DEV}
jwt.secret=${JWT_SECRET_DEV:local-development-only-jwt-secret-change-before-production-2026}
jwt.expiration=${JWT_EXPIRATION_DEV:86400000}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.clean-disabled=false
logging.level.com.personalfinance=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true
