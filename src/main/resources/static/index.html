<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BudgetManager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <style>
        :root{
            --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f2f4f7; --surface-3:#e9ecf1;
            --border:#e6e8ec; --border-strong:#d5d9e0;
            --text:#14171f; --text-2:#5b6271; --text-3:#8b92a1;
            --accent:#ff6a3d; --accent-2:#ff8a5c; --accent-soft:#fff1eb; --accent-text:#d9481c;
            --green:#14a36b; --green-soft:#e6f6ef; --red:#e5484d; --red-soft:#fdecec;
            --blue:#3e7bfa; --blue-soft:#eaf1ff; --violet:#8b5cf6; --violet-soft:#f1ebff;
            --amber:#e8a10b; --amber-soft:#fff6e0;
            --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
            --shadow-lg:0 20px 48px -12px rgba(16,24,40,.25);
            --radius:14px; --radius-sm:10px;
            --sidebar:248px;
            color-scheme:light;
        }
        :root[data-theme="dark"]{
            --bg:#0e1014; --surface:#161920; --surface-2:#1c2029; --surface-3:#252a35;
            --border:#252a34; --border-strong:#323845;
            --text:#eef0f4; --text-2:#a3aab8; --text-3:#6f7787;
            --accent:#ff7a4f; --accent-2:#ff946f; --accent-soft:#2a1a14; --accent-text:#ff9b78;
            --green:#34c48b; --green-soft:#12261e; --red:#f2676b; --red-soft:#2c1517;
            --blue:#6b9bff; --blue-soft:#151f33; --violet:#a78bfa; --violet-soft:#1f1830;
            --amber:#f5b83d; --amber-soft:#2a2210;
            --shadow:0 1px 2px rgba(0,0,0,.3);
            --shadow-lg:0 24px 60px -12px rgba(0,0,0,.6);
            color-scheme:dark;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        html,body{height:100%}
        body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
        button,input,select,textarea{font:inherit;color:inherit}
        button{cursor:pointer;border:none;background:none}
        a{color:var(--accent-text);text-decoration:none}
        svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
        .num{font-variant-numeric:tabular-nums}
        .muted{color:var(--text-2)} .faint{color:var(--text-3)}
        .pos{color:var(--green)} .neg{color:var(--red)}
        .hidden{display:none!important}

        /* ---------- AUTH ---------- */
        #auth{min-height:100%;display:grid;grid-template-columns:1.05fr 1fr}
        .auth-hero{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 0% 0%,#ff9466 0%,#ff6a3d 38%,#c2381a 100%);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
        .auth-hero:after{content:"";position:absolute;inset:auto -120px -160px auto;width:460px;height:460px;border-radius:50%;background:rgba(255,255,255,.08)}
        .auth-hero h1{font-size:40px;line-height:1.1;font-weight:800;letter-spacing:-.02em;max-width:440px}
        .auth-hero p{opacity:.85;margin-top:14px;max-width:420px;font-size:15px}
        .hero-card{position:relative;z-index:1;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.25);border-radius:18px;padding:20px;max-width:380px}
        .hero-card .lbl{font-size:12px;opacity:.8;text-transform:uppercase;letter-spacing:.06em}
        .hero-card .val{font-size:30px;font-weight:800;margin:4px 0 14px}
        .hero-bars{display:flex;align-items:flex-end;gap:8px;height:70px}
        .hero-bars span{flex:1;background:rgba(255,255,255,.7);border-radius:6px 6px 2px 2px}
        .auth-panel{display:flex;align-items:center;justify-content:center;padding:32px;background:var(--surface)}
        .auth-box{width:100%;max-width:380px}
        .auth-box h2{font-size:24px;font-weight:700;letter-spacing:-.01em}
        .auth-tabs{display:flex;background:var(--surface-2);border-radius:10px;padding:4px;margin:24px 0}
        .auth-tabs button{flex:1;padding:9px;border-radius:8px;font-weight:600;color:var(--text-2)}
        .auth-tabs button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
        .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em}
        .brand-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent-2),var(--accent));display:grid;place-items:center;color:#fff;box-shadow:0 4px 12px -4px var(--accent)}
        .brand-mark svg{width:18px;height:18px}
        .auth-hero .brand-mark{background:#fff;color:var(--accent)}
        details.adv{margin-top:18px;font-size:13px;color:var(--text-2)}
        details.adv summary{cursor:pointer;user-select:none}

        /* ---------- FORMS ---------- */
        .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
        .field label{font-size:12.5px;font-weight:600;color:var(--text-2)}
        .input,select.input,textarea.input{width:100%;height:40px;padding:0 12px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface);outline:none;transition:border .15s,box-shadow .15s}
        textarea.input{height:auto;min-height:72px;padding:10px 12px;resize:vertical}
        .input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
        .input:disabled{background:var(--surface-2);color:var(--text-3)}
        .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        .hint{font-size:12px;color:var(--text-3)}
        .amount-input{position:relative}
        .amount-input input{height:56px;font-size:26px;font-weight:700;padding-right:64px}
        .amount-input span{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-weight:600;color:var(--text-3)}
        .seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
        .seg button{flex:1;padding:8px 10px;border-radius:8px;font-weight:600;color:var(--text-2);font-size:13px;white-space:nowrap}
        .seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
        .seg button.on.inc{color:var(--green)} .seg button.on.exp{color:var(--red)} .seg button.on.adj{color:var(--violet)}
        .switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:14px}
        .switch input{appearance:none;width:40px;height:22px;border-radius:20px;background:var(--surface-3);position:relative;cursor:pointer;transition:.2s;flex:none}
        .switch input:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:var(--shadow);transition:.2s}
        .switch input:checked{background:var(--accent)} .switch input:checked:after{left:21px}
        .colors{display:flex;flex-wrap:wrap;gap:8px}
        .colors button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;outline:2px solid transparent}
        .colors button.on{outline-color:var(--text);border-color:var(--surface)}

        /* ---------- BUTTONS ---------- */
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border-radius:var(--radius-sm);font-weight:600;font-size:13.5px;white-space:nowrap;transition:background .15s,transform .05s,opacity .15s}
        .btn:active{transform:translateY(1px)}
        .btn:disabled{opacity:.55;pointer-events:none}
        .btn svg.i{width:16px;height:16px}
        .btn-primary{background:var(--accent);color:#fff;box-shadow:0 2px 8px -2px color-mix(in srgb,var(--accent) 60%,transparent)}
        .btn-primary:hover{background:var(--accent-2)}
        .btn-ghost{background:var(--surface);border:1px solid var(--border-strong);color:var(--text)}
        .btn-ghost:hover{background:var(--surface-2)}
        .btn-danger{background:var(--red);color:#fff}
        .btn-soft-danger{background:var(--red-soft);color:var(--red)}
        .btn-block{width:100%;height:44px}
        .btn-sm{height:32px;padding:0 11px;font-size:13px}
        .icon-btn{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--text-2)}
        .icon-btn:hover{background:var(--surface-2);color:var(--text)}
        .icon-btn.danger:hover{background:var(--red-soft);color:var(--red)}
        .icon-btn svg.i{width:16px;height:16px}

        /* ---------- LAYOUT ---------- */
        #app{display:flex;min-height:100%}
        .sidebar{width:var(--sidebar);flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:40;transition:transform .25s}
        .sidebar .brand{padding:22px 20px 18px}
        .nav{flex:1;padding:6px 12px;display:flex;flex-direction:column;gap:2px;overflow:auto}
        .nav-label{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;padding:14px 10px 6px}
        .nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--text-2);font-weight:550;font-weight:500}
        .nav a:hover{background:var(--surface-2);color:var(--text)}
        .nav a.on{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
        .side-foot{padding:12px;border-top:1px solid var(--border)}
        .me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px}
        .me:hover{background:var(--surface-2)}
        .avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none;background:linear-gradient(135deg,#7b8cff,#5a5fd8)}
        .avatar.sm{width:26px;height:26px;font-size:11px;border:2px solid var(--surface)}
        .me-info{flex:1;min-width:0}
        .me-info b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .me-info span{display:block;font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .side-actions{display:flex;gap:4px;margin-top:6px}
        .side-actions button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border-radius:8px;color:var(--text-2);font-size:12.5px;font-weight:600}
        .side-actions button:hover{background:var(--surface-2);color:var(--text)}
        .main{flex:1;margin-left:var(--sidebar);min-width:0;display:flex;flex-direction:column}
        .topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);padding:20px 32px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
        .topbar h1{font-size:24px;font-weight:750;font-weight:700;letter-spacing:-.02em}
        .topbar .sub{color:var(--text-3);font-size:13px;margin-top:2px}
        .topbar .grow{flex:1}
        .top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
        .menu-btn{display:none}
        .content{padding:4px 32px 48px;max-width:1360px;width:100%}
        .scrim{display:none}

        /* ---------- CARDS ---------- */
        .grid{display:grid;gap:16px}
        .g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
        .g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
        .g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
        .g-main{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)}
        .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
        .card-h{display:flex;align-items:center;gap:10px;padding:16px 20px 0}
        .card-h h3{font-size:15px;font-weight:650;font-weight:600;flex:1}
        .card-b{padding:16px 20px 20px}
        .card-link{font-size:13px;font-weight:600;color:var(--accent-text);display:inline-flex;align-items:center;gap:4px}
        .mb{margin-bottom:16px}
        .kpi{padding:18px 20px}
        .kpi .lbl{display:flex;align-items:center;gap:8px;color:var(--text-2);font-weight:500;font-size:13px}
        .kpi .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
        .kpi .ico svg.i{width:16px;height:16px}
        .kpi .val{font-size:26px;font-weight:750;font-weight:700;letter-spacing:-.02em;margin-top:12px}
        .kpi .delta{font-size:12.5px;margin-top:4px;color:var(--text-3);display:flex;gap:6px;align-items:center}
        .chip{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600}
        .chip.g{background:var(--green-soft);color:var(--green)} .chip.r{background:var(--red-soft);color:var(--red)}
        .chip.n{background:var(--surface-2);color:var(--text-2)} .chip.v{background:var(--violet-soft);color:var(--violet)}
        .chip.b{background:var(--blue-soft);color:var(--blue)} .chip.a{background:var(--amber-soft);color:var(--amber)}
        .chip.o{background:var(--accent-soft);color:var(--accent-text)}
        .chip svg.i{width:13px;height:13px}
        .ico.o{background:var(--accent-soft);color:var(--accent-text)} .ico.g{background:var(--green-soft);color:var(--green)}
        .ico.r{background:var(--red-soft);color:var(--red)} .ico.b{background:var(--blue-soft);color:var(--blue)} .ico.v{background:var(--violet-soft);color:var(--violet)} .ico.a{background:var(--amber-soft);color:var(--amber)}
        .chart-box{position:relative;height:260px}
        .chart-box.sm{height:220px}
        .hero-num{font-size:32px;font-weight:800;letter-spacing:-.02em}

        /* ---------- LISTS ---------- */
        .list{display:flex;flex-direction:column}
        .li{display:flex;align-items:center;gap:12px;padding:11px 20px;border-top:1px solid var(--border)}
        .li:first-child{border-top:none}
        .li.hov:hover{background:var(--surface-2)}
        .li .main-t{flex:1;min-width:0}
        .li .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .li .t2{font-size:12.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .li .amt{font-weight:650;font-weight:600;text-align:right;white-space:nowrap}
        .li .acts{display:flex;gap:2px;opacity:0;transition:opacity .15s}
        .li:hover .acts{opacity:1}
        .cat-ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
        .day-h{display:flex;justify-content:space-between;padding:10px 20px;background:var(--surface-2);font-size:12px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em;border-top:1px solid var(--border)}
        .day-h .num{text-transform:none}
        input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
        input[type=number]{-moz-appearance:textfield}
        .day-h:first-child{border-top:none;border-radius:var(--radius) var(--radius) 0 0}
        .tx-row{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.3fr) minmax(0,1.2fr) 130px 104px;align-items:center;gap:14px;padding:10px 20px;border-top:1px solid var(--border)}
        .tx-row:hover{background:var(--surface-2)}
        .tx-row:hover .acts{opacity:1}
        .tx-row .acts{display:flex;gap:2px;opacity:0;justify-content:flex-end}
        .tx-who{display:flex;align-items:center;gap:12px;min-width:0}
        .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;background:var(--surface-2);font-size:12.5px;font-weight:500;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .dot{width:8px;height:8px;border-radius:50%;flex:none}
        .empty{text-align:center;padding:48px 20px;color:var(--text-2)}
        .empty .e-ico{width:52px;height:52px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center;margin:0 auto 14px;color:var(--text-3)}
        .empty .e-ico svg.i{width:24px;height:24px}
        .empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
        .skeleton{background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:8px}
        @keyframes sh{to{background-position:-200% 0}}

        /* toolbar */
        .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
        .month-nav{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-sm);height:38px;padding:0 4px}
        .month-nav b{min-width:128px;text-align:center;font-weight:600;font-size:13.5px}
        .month-nav .icon-btn{width:30px;height:30px}
        .search{position:relative;flex:1;min-width:200px;max-width:340px}
        .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3)}
        .search input{padding-left:36px;height:38px}
        .toolbar select.input{width:auto;min-width:150px;height:38px}
        .sum-strip{display:flex;gap:28px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--border)}
        .sum-strip div span{display:block;font-size:12px;color:var(--text-3);font-weight:500}
        .sum-strip div b{font-size:17px}

        /* accounts */
        .acc-group{margin-bottom:20px}
        .acc-group-h{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--border)}
        .acc-group-h h3{flex:1;font-size:15px;font-weight:600}
        .acc-row{display:flex;align-items:center;gap:14px;padding:14px 20px;border-top:1px solid var(--border)}
        .acc-row:first-of-type{border-top:none}
        .acc-row:hover .acts{opacity:1}
        .acc-row .acts{display:flex;gap:2px;opacity:0}
        .avatars{display:flex}
        .avatars .avatar{margin-left:-7px} .avatars .avatar:first-child{margin-left:0}
        .bar{height:8px;background:var(--surface-2);border-radius:8px;overflow:hidden}
        .bar span{display:block;height:100%;border-radius:8px}
        .stack-bar{display:flex;height:10px;border-radius:10px;overflow:hidden;gap:2px;margin:14px 0}
        .legend{display:flex;flex-direction:column;gap:10px}
        .legend-i{display:flex;align-items:center;gap:10px;font-size:13px}
        .legend-i span.n{flex:1}
        .cat-break{display:flex;flex-direction:column;gap:14px}
        .cat-break .cb-top{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:13.5px}
        .cat-break .cb-top .n{flex:1;font-weight:600}
        .cat-break .subs{font-size:12px;color:var(--text-3);margin-top:5px}

        /* categories */
        .cat-card{padding:16px 18px;border-top:1px solid var(--border)}
        .cat-card:first-child{border-top:none}
        .cat-card-top{display:flex;align-items:center;gap:12px}
        .cat-card-top .n{flex:1;font-weight:600}
        .cat-card-top .acts{display:flex;opacity:.0;transition:.15s}
        .cat-card:hover .acts{opacity:1}
        .sub-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0 48px}
        .sub-chip{display:inline-flex;align-items:center;gap:2px;padding:3px 4px 3px 10px;border-radius:20px;background:var(--surface-2);font-size:12.5px;font-weight:500}
        .sub-chip button{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--text-3)}
        .sub-chip button:hover{background:var(--surface-3);color:var(--text)}
        .sub-chip button svg.i{width:12px;height:12px}
        .add-chip{border:1px dashed var(--border-strong);background:none;color:var(--text-2);padding:3px 10px}
        .add-chip:hover{border-color:var(--accent);color:var(--accent-text)}

        /* modal */
        .modal-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(10,12,18,.45);backdrop-filter:blur(3px);animation:fade .15s}
        .modal{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:480px;max-height:calc(100vh - 40px);display:flex;flex-direction:column;animation:pop .18s ease-out}
        .modal.wide{max-width:560px}
        .modal-h{display:flex;align-items:center;padding:20px 22px 6px}
        .modal-h h2{flex:1;font-size:18px;font-weight:700}
        .modal-b{padding:14px 22px;overflow:auto}
        .modal-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px 20px}
        @keyframes fade{from{opacity:0}} @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
        .token-box{display:flex;gap:8px;align-items:center;background:var(--surface-2);border-radius:10px;padding:10px 12px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;word-break:break-all}
        .note{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--text-2);margin-bottom:14px}

        /* toast */
        #toasts{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
        .toast{display:flex;align-items:center;gap:10px;background:var(--text);color:var(--bg);padding:12px 16px;border-radius:12px;box-shadow:var(--shadow-lg);font-weight:500;max-width:380px;animation:pop .2s}
        .toast .tdot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
        .toast.err .tdot{background:var(--red)}

        /* profile */
        .danger-zone{border-color:color-mix(in srgb,var(--red) 35%,var(--border))}
        .settings-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--border)}
        .settings-row:first-child{border-top:none;padding-top:0}


        /* ---------- NEW: tabs, badges, budgets, calendar, goals, sankey ---------- */
        .nav-badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}

        .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
        .tabs button{padding:10px 14px;font-weight:600;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-size:13.5px}
        .tabs button:hover{color:var(--text)}
        .tabs button.on{color:var(--accent-text);border-bottom-color:var(--accent)}
        .alert{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--radius);margin-bottom:16px;font-size:13.5px;border:1px solid}
        .alert.r{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 30%,transparent);color:color-mix(in srgb,var(--red) 75%,var(--text))}
        .alert.a{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 35%,transparent);color:color-mix(in srgb,var(--amber) 60%,var(--text))}
        .alert .grow{flex:1}
        .toast.warn .tdot{background:var(--amber)}
        .budget-row{padding:14px 20px;border-top:1px solid var(--border)}
        .budget-row:first-child{border-top:none}
        .budget-row .top{display:flex;align-items:center;gap:12px;margin-bottom:9px}
        .budget-row .top .n{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .budget-row .acts{display:flex;gap:2px;opacity:0;transition:opacity .15s}
        .budget-row:hover .acts{opacity:1}
        .pbar{position:relative;height:10px;background:var(--surface-2);border-radius:10px;overflow:visible}
        .pbar>span{display:block;height:100%;border-radius:10px;max-width:100%;transition:width .4s}
        .pbar .pace{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text-3);border-radius:2px}
        .budget-row .meta{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--text-3);margin-top:7px}
        .mini-budget{padding:9px 0}
        .mini-budget .top{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:6px}
        .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
        .cal .dow{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;text-align:center;padding:4px 0}
        .cal .day{min-height:78px;border:1px solid var(--border);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:3px;background:var(--surface);cursor:default;min-width:0}

        .cal .day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
        .cal .day .d{font-size:12px;font-weight:600;color:var(--text-2)}
        .cal .ev{font-size:11px;font-weight:600;padding:2px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .cal .ev.exp{background:var(--red-soft);color:var(--red)} .cal .ev.inc{background:var(--green-soft);color:var(--green)}
        .cal .ev.over{outline:1.5px dashed var(--amber)}
        .goal-card{padding:20px;display:flex;flex-direction:column;gap:14px}
        .goal-top{display:flex;align-items:center;gap:16px}
        .ring{position:relative;width:84px;height:84px;flex:none}
        .ring svg{width:84px;height:84px;transform:rotate(-90deg)}
        .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:700}
        .goal-card .acts{display:flex;gap:8px;flex-wrap:wrap}
        .tbl-wrap{overflow-x:auto}
        table.tbl{width:100%;border-collapse:collapse;font-size:13px}
        .tbl th{font-size:11.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;text-align:right;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface)}
        .tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:20px}
        .tbl th:last-child,.tbl td:last-child{padding-right:20px}
        .tbl td{padding:9px 12px;border-top:1px solid var(--border);text-align:right;white-space:nowrap}
        .tbl tr:hover td{background:var(--surface-2)}
        .tbl tfoot td{font-weight:700;border-top:2px solid var(--border-strong)}
        .tbl .delta{display:block;font-size:11px;font-weight:600;margin-top:1px}
        .tbl .cell-name{display:flex;align-items:center;gap:8px;max-width:260px;overflow:hidden;text-overflow:ellipsis}
        .sankey-wrap{overflow-x:auto}
        .sankey{display:block;width:100%;min-width:640px;height:auto}
        .sankey path.lnk{transition:opacity .15s;cursor:default}
        .sankey path.lnk:hover{opacity:.75}
        .sankey text{font-family:Inter,system-ui,sans-serif;fill:var(--text)}
        .sankey text.sub{fill:var(--text-3);font-size:11.5px}
        .crumb{display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:8px;min-height:24px}
        .crumb button{color:var(--accent-text);font-weight:600;display:inline-flex;align-items:center;gap:2px}
        .modal.xwide{max-width:900px}
        .hist-row{display:grid;grid-template-columns:96px minmax(0,1fr) 120px 130px;gap:12px;align-items:center;padding:9px 4px;border-top:1px solid var(--border);font-size:13px}
        .hist-row.h{font-size:11.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;border-top:none}
        .legend-click .legend-i{cursor:pointer;border-radius:8px;padding:4px 6px;margin:0 -6px}
        .legend-click .legend-i:hover{background:var(--surface-2)}

        /* responsive */
        @media (max-width:1180px){.g-4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main{grid-template-columns:1fr}.g-3{grid-template-columns:1fr 1fr}}

            body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
            .main{margin-left:0}.menu-btn{display:inline-grid}
            .topbar{padding:14px 16px}.content{padding:4px 16px 40px}
            .g-2,.g-3{grid-template-columns:1fr}
            .tx-row{grid-template-columns:minmax(0,1fr) auto;row-gap:4px}
            .tx-row .c-cat,.tx-row .c-acc{display:none}

            .cal .day{min-height:54px;padding:4px}.cal .ev{font-size:0;padding:0;height:6px;border-radius:3px}
            .budget-row .top{flex-wrap:wrap;row-gap:6px}.budget-row .top .n{flex:1 1 50%}.budget-row .top .num{order:5;flex:1 1 100%;text-align:left!important}
            .rec-li{flex-wrap:wrap}.rec-li .main-t{flex:1 1 60%}.rec-li .acts{flex:1 1 100%;justify-content:flex-end}
            .budget-row .meta{flex-direction:column;gap:2px}
            .hist-row{grid-template-columns:80px minmax(0,1fr) 100px}.hist-row .c-bal{display:none}
            .search{max-width:none}
            .toolbar select.input{flex:1 1 140px;min-width:0}
        }
        @media (max-width:520px){.g-4{grid-template-columns:1fr}.row{grid-template-columns:1fr}.kpi .val{font-size:22px}}
    </style>
</head>

    // Kategorie i podkategorie należą do grupy (systemowe są wspólne). groupId == null: bez filtrowania.
    function usableIn(x, groupId){ return !!x.system || groupId==null || x.groupId===groupId; }

    function isGroupOwner(groupId){ const g = (S.user?.groups||[]).find(x=>x.id===groupId); return !!g && g.ownerId!=null && g.ownerId===S.user?.id; }

    const spendAccs = () => S.accounts.filter(a=>!isLoan(a) && !isProperty(a));
    /** Wykres wartości netto: 'net' (z kredytami i nieruchomościami) albo 'liquid' (same pieniądze na kontach). */
    function nwMode(){ try { return localStorage.getItem('bm.nwMode')==='liquid' ? 'liquid' : 'net'; } catch(e){ return 'net'; } }
    function setNwMode(m){ try { localStorage.setItem('bm.nwMode', m); } catch(e){} }
    const liquidOf = h => num(h.totalBalance) - num(h.liabilitiesBalance) - num(h.propertyBalance);
    function currencies(){ return [...new Set(S.accounts.map(a=>(a.currency||'PLN').toUpperCase()))]; }
    function pickMainCurrency(){
        const cs = currencies(); if(!cs.length) return 'PLN';
        const totals = {}; S.accounts.forEach(a=>{ const c=(a.currency||'PLN').toUpperCase(); totals[c]=(totals[c]||0)+1; });
        if (cs.includes('PLN')) return 'PLN';
        return cs.sort((a,b)=>totals[b]-totals[a])[0];
    }
    const inCur = (list, cur=S.currency) => list.filter(t => accCur(t.accountId) === cur || (!accById(t.accountId) && cur===S.currency));
    const signed = t => TX_TYPES[t.type]?.sign==='−' ? -num(t.amount) : num(t.amount);

    /* =========================================================
       API
       ========================================================= */
    async function api(method, path, body){
        const headers = {'Accept':'application/json'};
        if (body !== undefined) headers['Content-Type'] = 'application/json';
        if (token) headers['Authorization'] = 'Bearer ' + token;
        let res;
        try { res = await fetch(API + path, {method, headers, body: body!==undefined ? JSON.stringify(body) : undefined}); }
        catch { throw new Error('Brak połączenia z serwerem' + (API ? ` (${API})` : '')); }
        if (res.status === 401 && token && !path.startsWith('/api/auth/')) { logout(true, true); throw new Error('Sesja wygasła. Zaloguj się ponownie.'); }
        if (res.status === 204) return null;
        const text = await res.text();
        let data = null; try { data = text ? JSON.parse(text) : null; } catch { data = text; }
        if (!res.ok) {
            const msg = (data && typeof data==='object' && data.message) ? data.message : (typeof data==='string' && data && data.length<200 ? data : `Błąd serwera (${res.status})`);
            throw new Error(translateError(msg, res.status));
        }
        return data;
    }
    const qs = o => { const p = Object.entries(o).filter(([,v])=>v!==undefined&&v!==null&&v!==''); return p.length ? '?'+p.map(([k,v])=>`${k}=${encodeURIComponent(v)}`).join('&') : ''; };

    function translateError(msg, status){ for (const [re,pl] of ERR_PL) if (re.test(msg)) return pl; if (status===409) return 'Taki adres e-mail jest już zajęty.'; return msg; }

    /* =========================================================
       UI HELPERS: toast, modal, confirm
       ========================================================= */
    function toast(msg, type='ok'){
        const el = document.createElement('div');
        el.className = 'toast ' + (type==='err'?'err':type==='warn'?'warn':'');
        el.innerHTML = `<span class="tdot"></span><span>${esc(msg)}</span>`;
        $('#toasts').appendChild(el);
        setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 3600);
    }
    let modalStack = [];
    function openModal({title, body, footer='', wide=false, xwide=false, onMount}){
        const wrap = document.createElement('div');
        wrap.className = 'modal-wrap';
        wrap.innerHTML = `<div class="modal ${wide?'wide':''} ${xwide?'xwide':''}" role="dialog" aria-modal="true">
    <div class="modal-h"><h2>${title}</h2><button class="icon-btn" data-close>${icon('x')}</button></div>
    <div class="modal-b">${body}</div>${footer?`<div class="modal-f">${footer}</div>`:''}</div>`;
        wrap.addEventListener('mousedown', e=>{ if(e.target===wrap) closeModal(); });
        wrap.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal());
        $('#modal-root').appendChild(wrap);
        modalStack.push(wrap);
        onMount && onMount(wrap);
        setTimeout(()=>{ const f = wrap.querySelector('input:not([type=hidden]):not(:disabled),select'); f && f.focus(); }, 40);
        return wrap;
    }
    function closeModal(){ const m = modalStack.pop(); m && m.remove(); }
    document.addEventListener('keydown', e=>{ if(e.key==='Escape' && modalStack.length) closeModal(); });
    function confirmBox({title, text, okText='Usuń', danger=true}){
        return new Promise(resolve=>{
            const m = openModal({title, body:`<p class="muted">${text}</p>`,
                footer:`<button class="btn btn-ghost" data-close>Anuluj</button><button class="btn ${danger?'btn-danger':'btn-primary'}" id="cf-ok">${okText}</button>`});
            m.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{ closeModal(); resolve(false); });
            $('#cf-ok', m).onclick = ()=>{ closeModal(); resolve(true); };
        });
    }
    async function withBtn(btn, fn){
        const old = btn.innerHTML; btn.disabled = true; btn.innerHTML = 'Zapisywanie…';
        try { return await fn(); } finally { btn.disabled = false; btn.innerHTML = old; }
    }
    function emptyState(ic, title, text, action=''){
        return `<div class="empty"><div class="e-ico">${icon(ic)}</div><b>${title}</b><div>${text}</div>${action?`<div style="margin-top:16px">${action}</div>`:''}</div>`;
    }
    function skeleton(n=3){ return `<div class="grid g-4 mb">${Array(4).fill('<div class="card kpi"><div class="skeleton" style="height:14px;width:60%"></div><div class="skeleton" style="height:26px;width:80%;margin-top:16px"></div></div>').join('')}</div><div class="card card-b">${Array(n).fill('<div class="skeleton" style="height:18px;margin:12px 0"></div>').join('')}</div>`; }
    function destroyCharts(){ Object.keys(charts).forEach(k=>{ charts[k].destroy(); delete charts[k]; }); }

    /* =========================================================
       AUTH
       ========================================================= */
    function showAuth(mode='login'){
        $('#app').classList.add('hidden'); $('#auth').classList.remove('hidden');
        $$('.auth-tabs button').forEach(b=>b.classList.toggle('on', b.dataset.auth===mode));
        $('#login-form').classList.toggle('hidden', mode!=='login');
        $('#register-form').classList.toggle('hidden', mode!=='register');
        $('#auth-title').textContent = mode==='login' ? 'Witaj ponownie' : 'Załóż konto';
        $('#auth-sub').textContent = mode==='login' ? 'Zaloguj się, aby zobaczyć swoje finanse.' : 'To zajmie mniej niż minutę.';
        $('#api-url').value = API;
    }
    $$('.auth-tabs button').forEach(b=>b.onclick=()=>showAuth(b.dataset.auth));
    $('#api-url').addEventListener('change', e=>{ API = e.target.value.trim().replace(/\/+$/,''); store.set('bm_api', API); });
    $('#login-form').addEventListener('submit', async e=>{
        e.preventDefault(); const f = e.target, btn = f.querySelector('button');
        await withBtn(btn, async ()=>{
            try {
                const r = await api('POST','/api/auth/login',{email:f.email.value.trim(), password:f.password.value});
                token = r.token; store.sset('bm_token', token); f.password.value='';
                await boot();
            } catch(err){ toast(err.message,'err'); }
        });
    });
    $('#register-form').addEventListener('submit', async e=>{
        e.preventDefault(); const f = e.target, btn = f.querySelector('button');
        await withBtn(btn, async ()=>{
            try {
                const email = f.email.value.trim(), password = f.password.value;
                await api('POST','/api/auth/register',{name:f.name.value.trim(), email, password});
                const r = await api('POST','/api/auth/login',{email, password});
                token = r.token; store.sset('bm_token', token); f.reset();
                toast('Konto utworzone. Witaj!');
                await boot();
            } catch(err){ toast(err.message,'err'); }
        });
    });
    function logout(expired=false, silent=false){
        const old = token; token = null; store.sset('bm_token', null);
        if (old && !expired) fetch(API+'/api/auth/logout',{method:'POST',headers:{Authorization:'Bearer '+old}}).catch(()=>{});
        destroyCharts(); closeAllModals();
        Object.assign(S,{user:null,accounts:[],archived:[],categories:[],subcategories:[],allTx:null,loans:null});
        showAuth('login');
        if (expired && !silent) toast('Sesja wygasła. Zaloguj się ponownie.','err');
    }
    function closeAllModals(){ while(modalStack.length) closeModal(); }

    async function boot(){
        try {
            const [user, accounts, categories, subcategories] = await Promise.all([
                api('GET','/api/users/me'), api('GET','/api/accounts'), api('GET','/api/categories'), api('GET','/api/subcategories')]);
            S.user = user; S.accounts = accounts||[]; S.categories = categories||[]; S.subcategories = subcategories||[];
            S.currency = pickMainCurrency(); S.allTx = null;
        } catch(err){
            if (token) toast(err.message,'err');
            token = null; store.sset('bm_token', null); showAuth('login'); return;
        }
        $('#auth').classList.add('hidden'); $('#app').classList.remove('hidden');
        renderMe();
        const v = location.hash.slice(1);
        go(VIEWS.some(x=>x.id===v) ? v : 'dashboard');

            budgets:viewBudgets, recurring:viewRecurring, goals:viewGoals, loans:viewLoans})[view]();

       CHART HELPERS
       ========================================================= */
    function chartBase(){
        Chart.defaults.font.family = 'Inter, system-ui, sans-serif';
        Chart.defaults.font.size = 12;
        Chart.defaults.color = cssVar('--text-3');
        Chart.defaults.borderColor = cssVar('--border');
    }
    function tooltipStyle(){
        return {backgroundColor:cssVar('--text'), titleColor:cssVar('--bg'), bodyColor:cssVar('--bg'), padding:10, cornerRadius:10, displayColors:true, boxPadding:4, usePointStyle:true};
    }
    function mkChart(key, canvas, cfg){ if (!canvas || !window.Chart) return; chartBase(); charts[key]?.destroy(); charts[key] = new Chart(canvas, cfg); }
    function lineGradient(ctx, color){
        const g = ctx.createLinearGradient(0,0,0,ctx.canvas.clientHeight||260);
        g.addColorStop(0, hexA(color,.28)); g.addColorStop(1, hexA(color,0)); return g;
    }

    /* aggregate monthly cashflow from transactions (main currency) */
    function monthlySeries(txs, endYM, count){
        const out = [];
        for (let i=count-1;i>=0;i--){
            const ym = shiftMonth(endYM, -i), key = `${ym.y}-${ym.m}`;
            let inc=0, exp=0;
            txs.forEach(t=>{ if (ymKey(t.transactionDate)!==key) return; if(t.type==='INCOME') inc+=num(t.amount); else if(t.type==='EXPENSE') exp+=num(t.amount); });
            out.push({label:`${MSHORT[ym.m-1]}${ym.m===1||i===count-1?' '+String(ym.y).slice(2):''}`, inc, exp, net:inc-exp, ym});
        }
        return out;
    }
    function cashflowChart(key, canvas, series){
        const green = cssVar('--green'), red = cssVar('--red');
        mkChart(key, canvas, {type:'bar', data:{labels:series.map(s=>s.label), datasets:[
                    {label:'Przychody', data:series.map(s=>s.inc), backgroundColor:green, borderRadius:6, maxBarThickness:22},
                    {label:'Wydatki', data:series.map(s=>-s.exp), backgroundColor:red, borderRadius:6, maxBarThickness:22},
                ]},
            options:{responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
                plugins:{legend:{display:false}, tooltip:{...tooltipStyle(), callbacks:{label:c=>` ${c.dataset.label}: ${fmtMoney(Math.abs(c.raw))}`, footer:it=>'Bilans: '+fmtMoney(it.reduce((a,c)=>a+c.raw,0))}}},
                scales:{x:{stacked:true, grid:{display:false}}, y:{stacked:true, grid:{color:cssVar('--border')}, border:{display:false}, ticks:{callback:v=>fmtCompact(v)}}}}});
    }
    function donutChart(key, canvas, labels, values, colors){
        mkChart(key, canvas, {type:'doughnut', data:{labels, datasets:[{data:values, backgroundColor:colors, borderColor:cssVar('--surface'), borderWidth:3, hoverOffset:6}]},
            options:{responsive:true, maintainAspectRatio:false, cutout:'72%', plugins:{legend:{display:false}, tooltip:{...tooltipStyle(), callbacks:{label:c=>` ${c.label}: ${fmtMoney(c.raw)}`}}}}});
    }

        const range = S.txAll ? {} : monthRange(S.txMonth);
        try {
            const p = await api('GET','/api/transactions/page'+qs({page:more&&txPage?txPage.page+1:0, size:TX_PAGE_SIZE,
                from:range.from, to:range.to, type:S.txType==='ALL'?'':S.txType, categoryId:S.txCat, accountId:S.txAcc,
                q:S.txSearch.trim(), ...scopeParams(S.txScope)}));
            if (seq!==txSeq) return; // w międzyczasie zmienił się filtr, liczy się nowsze zapytanie
            txRows = more ? txRows.concat(p?.content||[]) : (p?.content||[]);
            txPage = p;
        } catch(err){
            if (seq!==txSeq) return;
            if (!more){ txRows=[]; txPage=null; }
            toast(err.message,'err');
        }
        if (S.view==='transactions') drawTx();
    }
    function drawTx(){
        const rows = txRows; // serwer zwraca już przefiltrowane i posortowane od najnowszych
        const box = $('#t-list'); if(!box) return;
        const filtered = S.txType!=='ALL' || S.txCat || S.txAcc || S.txSearch.trim() || S.txScope;
        if (!rows.length) { box.innerHTML = emptyState('list','Brak transakcji', filtered ? 'Żadna transakcja nie pasuje do filtrów.' : `Nie ma transakcji ${S.txAll?'':'w okresie '+monthLabel(S.txMonth)}.`, `<button class="btn btn-primary btn-sm" onclick="txModal()">${icon('plus')}Dodaj transakcję</button>`); return; }
        // Sumy liczy serwer dla całego filtra, nie tylko dla wczytanych stron.
        const totals = (txPage?.totals||[]).filter(v=>num(v.income) || num(v.expense));
        const strip = totals.map(v=>{ const cu=v.currency, inc=num(v.income), exp=num(v.expense); return `
    <div><span>Przychody${totals.length>1?' '+cu:''}</span><b class="num pos">${fmtMoney(inc,cu)}</b></div>
    <div><span>Wydatki</span><b class="num neg">${fmtMoney(exp,cu)}</b></div>
    <div><span>Bilans</span><b class="num ${inc-exp>=0?'pos':'neg'}">${fmtMoney(inc-exp,cu)}</b></div>`; }).join('');
        let html = `<div class="sum-strip">${strip}<div><span>Liczba</span><b class="num">${txPage?.totalElements ?? rows.length}</b></div></div>`;
        let day = null, dayTotal = {};
        const groups = [];
        rows.forEach(t=>{ if (t.transactionDate!==day){ day=t.transactionDate; groups.push({day, items:[]}); } groups[groups.length-1].items.push(t); });
        html += groups.map(g=>{
            const tot = g.items.reduce((s,t)=>s+signed(t),0);
            return `<div class="day-h"><span>${fmtDayHeader(g.day)}</span><span class="num">${tot>=0?'+':''}${fmtMoney(tot, accCur(g.items[0].accountId))}</span></div>` + g.items.map(t=>{
                const tt = TX_TYPES[t.type]||{n:t.type,c:'n'}, col = catColor(t.categoryName), cu = accCur(t.accountId);
                const locked = t.type==='INITIAL_BALANCE' || t.type==='LIABILITY_OPENING';
                const valuation = isProperty(accById(t.accountId)); // wycenę zmienia się nową wyceną, nie edycją
                const mayChange = canChangeEntry(t.userId, t.accountId); // autor albo właściciel grupy

                return `<div class="tx-row">
        <div class="tx-who"><span class="cat-ico" style="background:${hexA(col,.14)};color:${col}">${esc(initials(t.categoryName).slice(0,1))}</span>
          <div style="min-width:0"><div class="t1" style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.description || t.subcategoryName || t.categoryName)}</div>
          <div class="faint" style="font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.type!=='INCOME'&&t.type!=='EXPENSE'?`<span class="chip ${tt.c}" style="padding:0 6px;font-size:11px">${tt.n}</span> `:''}${esc(t.userName||'')}</div></div></div>
        <div class="c-cat"><span class="pill"><span class="dot" style="background:${col}"></span>${esc(t.categoryName)}${t.subcategoryName?` <span class="faint">/ ${esc(t.subcategoryName)}</span>`:''}</span></div>
        <div class="c-acc muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.accountName)}</div>
        <div class="num" style="text-align:right;font-weight:600"><span class="${signed(t)<0?'':'pos'}">${signed(t)<0?'−':'+'}${fmtMoney(Math.abs(num(t.amount)),cu)}</span></div>
        <div class="acts">${locked?'':`${t.type==='INCOME'||t.type==='EXPENSE'?`<button class="icon-btn" title="Ustaw jako cykliczną" onclick="recurringFromTx(${t.id})">${icon('repeat')}</button>`:''}${valuation||!mayChange?'':`<button class="icon-btn" title="Edytuj" onclick="txModal(${t.id})">${icon('edit')}</button>`}${mayChange?`<button class="icon-btn danger" title="Usuń" onclick="deleteTx(${t.id})">${icon('trash')}</button>`:''}`}</div>
      </div>`; }).join('');
        }).join('');
        const left = (txPage?.totalElements||0) - rows.length;
        if (left > 0) html += `<div class="card-b" style="text-align:center"><button class="btn btn-ghost btn-sm" id="t-more">Pokaż więcej (zostało ${left})</button></div>`;
        box.innerHTML = html;
        const more = $('#t-more');
        if (more) more.onclick = ()=>{ more.disabled = true; more.textContent = 'Wczytywanie…'; loadTx(true); };
    }

    function txModal(id){
        const editing = id ? (txRows.find(t=>t.id===id) || (S.allTx||[]).find(t=>t.id===id)) : null;
        if (!S.accounts.length){ toast('Najpierw utwórz konto','err'); return accountModal(); }
        const hasAdj = S.categories.some(c=>c.type==='ADJUSTMENT');
        let type = editing ? editing.type : 'EXPENSE';
        const accOpts = spendAccs().map(a=>`<option value="${a.id}" ${editing&&String(editing.accountId)===String(a.id)?'selected':''}>${esc(a.name)} · ${fmtMoney(a.balance,a.currency)}</option>`).join('');
        const m = openModal({title: editing?'Edytuj transakcję':'Nowa transakcja', body:`
    <div class="seg" id="tx-type" style="margin-bottom:16px">
      <button type="button" data-k="EXPENSE" class="exp">Wydatek</button><button type="button" data-k="INCOME" class="inc">Przychód</button>${hasAdj?'<button type="button" data-k="ADJUSTMENT" class="adj">Korekta</button>':''}
    </div>
    <div class="field amount-input"><input class="input num" id="tx-amount" type="number" step="0.01" min="0.01" placeholder="0,00" value="${editing?num(editing.amount):''}"><span id="tx-cur">PLN</span></div>
    <div class="field"><label>Konto</label><select class="input" id="tx-acc" ${editing?'disabled':''}>${accOpts}</select></div>
    <div class="row">
      <div class="field"><label>Kategoria</label><select class="input" id="tx-cat"></select></div>
      <div class="field"><label>Podkategoria</label><select class="input" id="tx-sub"></select></div>
    </div>
    <div class="note warn hidden" id="tx-nosub"></div>
    <div class="row">
      <div class="field"><label>Data</label><input class="input" type="date" id="tx-date" value="${editing?editing.transactionDate:isoLocal()}"></div>
      <div class="field"><label>Opis</label><input class="input" id="tx-desc" maxlength="255" placeholder="np. Zakupy w Biedronce" value="${esc(editing?.description||'')}"></div>
    </div>`,
            footer:`<button class="btn btn-ghost" data-close>Anuluj</button><button class="btn btn-primary" id="tx-save">${editing?'Zapisz zmiany':'Dodaj transakcję'}</button>`});
        const setType = k=>{
            type = k; $$('#tx-type button', m).forEach(b=>b.classList.toggle('on', b.dataset.k===k));
            const g = accGroup(editing ? editing.accountId : $('#tx-acc',m).value), prev = $('#tx-cat',m).value;
            const cats = S.categories.filter(c=>c.type===k && usableIn(c, g));
            $('#tx-cat',m).innerHTML = cats.length ? cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('') : '<option value="">Brak kategorii</option>';
            if (cats.some(c=>String(c.id)===prev)) $('#tx-cat',m).value = prev;
            if (editing){ const ec = cats.find(c=>c.id===editing.categoryId) || catByName(editing.categoryName, k); if (ec) $('#tx-cat',m).value = ec.id; }
            fillSubs();
        };
        const fillSubs = ()=>{
            const cat = S.categories.find(c=>String(c.id)===$('#tx-cat',m).value);
            const subs = cat ? subsOf(cat, accGroup(editing ? editing.accountId : $('#tx-acc',m).value)) : [];
            $('#tx-sub',m).innerHTML = subOptions(subs, editing && cat && cat.id===editing.categoryId ? editing.subcategoryId : null);
            const warn = $('#tx-nosub',m);
            if (!cat) { warn.innerHTML = `Brak kategorii tego typu. <a href="#categories" data-close-go="categories">Dodaj kategorię</a>`; warn.classList.remove('hidden'); }
            else warn.classList.add('hidden');
            $$('[data-close-go]',m).forEach(a=>a.onclick=e=>{ e.preventDefault(); closeModal(); go(a.dataset.closeGo); });
        };
        const updCur = ()=>{ $('#tx-cur',m).textContent = accCur($('#tx-acc',m).value) || 'PLN'; };
        $$('#tx-type button', m).forEach(b=>b.onclick=()=>{ if(!editing) setType(b.dataset.k); });
        if (editing) $$('#tx-type button', m).forEach(b=>b.disabled = b.dataset.k!==editing.type);
        $('#tx-cat',m).onchange = fillSubs; $('#tx-acc',m).onchange = ()=>{ updCur(); setType(type); };
        setType(type); updCur();
        $('#tx-save',m).onclick = e=> withBtn(e.currentTarget, async ()=>{
            const amount = num($('#tx-amount',m).value), categoryId = +$('#tx-cat',m).value || null, subcategoryId = +$('#tx-sub',m).value || null;
            const transactionDate = $('#tx-date',m).value || isoLocal(), description = $('#tx-desc',m).value.trim();
            if (!(amount>0)) return toast('Podaj kwotę większą od zera','err');
            if (!categoryId) return toast('Wybierz kategorię','err');
            try {
                if (editing) {
                    await api('PATCH','/api/transactions/'+editing.id,{amount, description:description||null, transactionDate, categoryId, subcategoryId, clearSubcategory:!subcategoryId});
                } else {
                    await api('POST','/api/transactions',{amount, type, accountId:+$('#tx-acc',m).value, categoryId, subcategoryId, transactionDate, description:description||undefined});
                    toast(type==='EXPENSE'?'Dodano wydatek':type==='INCOME'?'Dodano przychód':'Dodano korektę');
                }
                closeModal(); await refreshAccounts(); S.allTx=null; afterTxChange();
                if (type==='EXPENSE') checkBudgetAfterExpense(categoryId, transactionDate);
            } catch(err){ toast(err.message,'err'); }
        });
    }
    function afterTxChange(){ if (S.view==='transactions') loadTx(); else rerender(); }
    async function deleteTx(id){
        if (!await confirmBox({title:'Usunąć transakcję?', text:'Saldo konta zostanie odpowiednio skorygowane. Tej operacji nie można cofnąć.'})) return;
        try { await api('DELETE','/api/transactions/'+id); toast('Transakcja usunięta'); await refreshAccounts(); S.allTx=null; afterTxChange(); }
        catch(err){ toast(err.message,'err'); }
    }

    /* =========================================================
       TRANSFERS
       ========================================================= */
    let trRows = [];
    async function viewTransfers(){
        setHeader('Przelewy', 'Przesunięcia środków między Twoimi kontami', `<button class="btn btn-primary" id="tr-add">${icon('plus')}Nowy przelew</button>`);
        $('#tr-add').onclick = ()=>transferModal();
        $('#content').innerHTML = `
    <div class="toolbar">
      <div class="month-nav"><button class="icon-btn" id="tr-prev">${icon('left')}</button><b id="tr-month"></b><button class="icon-btn" id="tr-next">${icon('right')}</button></div>
      <select class="input" id="tr-acc"><option value="">Wszystkie konta</option>${S.accounts.map(a=>`<option value="${a.id}" ${String(S.trAcc)===String(a.id)?'selected':''}>${esc(a.name)}</option>`).join('')}</select>
      ${scopeSelect('tr-scope', S.trScope)}
    </div>
    <div class="card" id="tr-list"><div class="card-b">${'<div class="skeleton" style="height:18px;margin:14px 0"></div>'.repeat(4)}</div></div>`;
        const upd = ()=>{ $('#tr-month').textContent = S.trAll ? 'Cały okres' : monthLabel(S.trMonth); };
        upd();
        $('#tr-prev').onclick = ()=>{ if(S.trAll){ S.trAll=false; S.trMonth={m:now.getMonth()+1,y:now.getFullYear()}; } else S.trMonth=shiftMonth(S.trMonth,-1); upd(); loadTr(); };
        $('#tr-next').onclick = ()=>{ if(S.trAll) return; const n=shiftMonth(S.trMonth,1); if(isFuture(n)) S.trAll=true; else S.trMonth=n; upd(); loadTr(); };
        $('#tr-acc').onchange = e=>{ S.trAcc=e.target.value; loadTr(); };
        if ($('#tr-scope')) $('#tr-scope').onchange = e=>{ S.trScope=e.target.value; loadTr(); };
        await loadTr();

    async function loadTr(){
        try { trRows = await api('GET','/api/transfers'+qs({accountId:S.trAcc, month:S.trAll?'':S.trMonth.m, year:S.trAll?'':S.trMonth.y, ...scopeParams(S.trScope)})) || []; }
        catch(err){ trRows=[]; toast(err.message,'err'); }
        if (S.view!=='transfers') return;
        const rows = [...trRows].sort((a,b)=>String(b.transferDate).localeCompare(String(a.transferDate)) || b.id-a.id);
        const box = $('#tr-list');
        if (!rows.length){ box.innerHTML = emptyState('swap','Brak przelewów', S.accounts.length<2 ? 'Do przelewu potrzebujesz co najmniej dwóch kont.' : 'Przenieś środki np. na konto oszczędnościowe.', S.accounts.length>=2?`<button class="btn btn-primary btn-sm" onclick="transferModal()">${icon('plus')}Nowy przelew</button>`:''); return; }
        box.innerHTML = `<div class="list">${rows.map(t=>{
            const fx = (t.fromCurrency||'').toUpperCase() !== (t.toCurrency||'').toUpperCase();
            const toSav = t.toAccountType==='SAVINGS'||t.toAccountType==='INVESTMENT';
            return `<div class="li hov">
      <span class="cat-ico ico ${toSav?'a':'b'}">${icon(toSav?'piggy':'swap')}</span>
      <div class="main-t"><div class="t1" style="display:flex;align-items:center;gap:6px">${esc(t.fromAccountName)} <span class="faint">${icon('arrow')}</span> ${esc(t.toAccountName)}</div>
        <div class="t2">${fmtDate(t.transferDate)}${t.description?' · '+esc(t.description):''}${t.userName?' · '+esc(t.userName):''}${fx?` · kurs ${num(t.exchangeRate)}`:''}</div></div>
      <div class="amt num"><div>${fmtMoney(t.amount,t.fromCurrency)}</div>${fx?`<div class="faint" style="font-size:12px;font-weight:500">→ ${fmtMoney(t.receivedAmount,t.toCurrency)}</div>`:''}</div>
            <div class="acts">${canChangeEntry(t.userId, t.fromAccountId)?`<button class="icon-btn" title="Edytuj" onclick="transferModal(${t.id})">${icon('edit')}</button><button class="icon-btn danger" title="Cofnij" onclick="deleteTransfer(${t.id})">${icon('trash')}</button>`:''}</div>
    </div>`; }).join('')}</div>`;
    }
    function transferModal(id){
        if (spendAccs().length<2){ toast('Do przelewu potrzebujesz dwóch kont','err'); return; }
        const ed = id ? trRows.find(t=>t.id===id) : null;
        const opts = sel => spendAccs().map(a=>`<option value="${a.id}" ${String(sel)===String(a.id)?'selected':''}>${esc(a.name)} · ${fmtMoney(a.balance,a.currency)}</option>`).join('');
        const m = openModal({title: ed?'Edytuj przelew':'Nowy przelew', body:`
    <div class="field"><label>Z konta</label><select class="input" id="tr-from">${opts(ed?ed.fromAccountId:spendAccs()[0].id)}</select></div>
    <div class="field"><label>Na konto</label><select class="input" id="tr-to">${opts(ed?ed.toAccountId:spendAccs()[1].id)}</select></div>
    <div class="field amount-input"><input class="input num" type="number" step="0.01" min="0.01" id="tr-amount" placeholder="0,00" value="${ed?num(ed.amount):''}"><span id="tr-cur"></span></div>
    <div class="field hidden" id="tr-rate-f"><label id="tr-rate-l">Kurs wymiany</label><input class="input num" type="number" step="0.000001" min="0" id="tr-rate" value="${ed&&ed.exchangeRate?num(ed.exchangeRate):''}"></div>
    <div class="fx-preview hidden" id="tr-prev"></div>
    <div class="row">
      <div class="field"><label>Data</label><input class="input" type="date" id="tr-date" value="${ed?ed.transferDate:isoLocal()}"></div>
      <div class="field"><label>Opis</label><input class="input" id="tr-desc" maxlength="255" value="${esc(ed?.description||'')}" placeholder="opcjonalnie"></div>
    </div>`,
            footer:`<button class="btn btn-ghost" data-close>Anuluj</button><button class="btn btn-primary" id="tr-save">${ed?'Zapisz zmiany':'Wykonaj przelew'}</button>`});
        const upd = ()=>{
            const fc = accCur($('#tr-from',m).value), tc = accCur($('#tr-to',m).value), fx = fc!==tc;
            $('#tr-cur',m).textContent = fc;
            $('#tr-rate-f',m).classList.toggle('hidden',!fx);
            $('#tr-rate-l',m).textContent = `Kurs wymiany (1 ${fc} = ? ${tc})`;
            const a = num($('#tr-amount',m).value), r = num($('#tr-rate',m).value);
            const pv = $('#tr-prev',m);
            if (fx && a>0 && r>0){ pv.classList.remove('hidden'); pv.innerHTML = `<span>Odbiorca otrzyma</span><span class="num">${fmtMoney(Math.round(a*r*100)/100, tc)}</span>`; } else pv.classList.add('hidden');
        };
        ['tr-from','tr-to','tr-amount','tr-rate'].forEach(i=>$('#'+i,m).addEventListener('input',upd)); upd();
        $('#tr-save',m).onclick = e=>withBtn(e.currentTarget, async ()=>{
            const fromAccountId = +$('#tr-from',m).value, toAccountId = +$('#tr-to',m).value;
            const amount = $('#tr-amount',m).value.replace(',','.'), rate = $('#tr-rate',m).value.replace(',','.');
            if (fromAccountId===toAccountId) return toast('Wybierz dwa różne konta','err');
            if (!(num(amount)>0)) return toast('Podaj kwotę większą od zera','err');
            const fx = accCur(fromAccountId)!==accCur(toAccountId);
            if (fx && !(num(rate)>0)) return toast('Podaj kurs wymiany','err');
            const body = {fromAccountId, toAccountId, amount:+(+amount).toFixed(2), transferDate:$('#tr-date',m).value||isoLocal(), description:$('#tr-desc',m).value.trim()||undefined};
            if (fx) body.exchangeRate = +rate;
            try {
                if (ed) await api('PATCH','/api/transfers/'+ed.id, body); else await api('POST','/api/transfers', body);
                toast(ed?'Przelew zaktualizowany':'Przelew wykonany'); closeModal(); await refreshAccounts();
                if (S.view==='transfers') loadTr(); else rerender();
            } catch(err){ toast(err.message,'err'); }
        });
    }
    async function deleteTransfer(id){
        if (!await confirmBox({title:'Cofnąć przelew?', text:'Środki wrócą na konto źródłowe, a przelew zniknie z historii.', okText:'Cofnij przelew'})) return;
        try { await api('DELETE','/api/transfers/'+id); toast('Przelew cofnięty'); await refreshAccounts(); loadTr(); }
        catch(err){ toast(err.message,'err'); }
    }

    /* =========================================================
       ACCOUNTS
       ========================================================= */
    async function viewAccounts(){
        setHeader('Konta', 'Salda wszystkich kont w Twoich grupach', `${currencySelect()}<button class="btn btn-primary" id="a-add">${icon('plus')}Dodaj konto</button>`);
        bindCurrencySelect(); $('#a-add').onclick = ()=>accountModal();
        const c = $('#content'); c.innerHTML = skeleton(4);
        try { await refreshAccounts(); S.archived = await api('GET','/api/accounts/archived') || []; } catch(err){ toast(err.message,'err'); }
        if (S.view!=='accounts') return;
        if (!S.accounts.length && !S.archived.length){
            c.innerHTML = `<div class="card">${emptyState('wallet','Nie masz jeszcze kont','Dodaj konto bankowe, gotówkę, oszczędności lub inwestycje.',`<button class="btn btn-primary" onclick="accountModal()">${icon('plus')}Dodaj pierwsze konto</button>`)}</div>`; return;
        }
        const byCurType = {};
        S.accounts.forEach(a=>{ const cu=(a.currency||'').toUpperCase(); if(cu!==S.currency) return; byCurType[a.accountType]=(byCurType[a.accountType]||0)+num(a.balance); });
        const total = Object.entries(byCurType).filter(([k])=>k!=='LOAN').reduce((a,[,b])=>a+b,0);
        const debt = byCurType.LOAN || 0, prop = byCurType.PROPERTY || 0;
        const hasProp = S.accounts.some(isProperty);
        // Kafelki: tylko konta płynne; nieruchomości i kredyty są w podsumowaniu niżej.
        const liquidTotal = total - prop;
        let html = `<div class="grid g-4 mb">${Object.entries(ACC_TYPES).filter(([k])=>k!=='LOAN' && k!=='PROPERTY').map(([k,t])=>`
    <div class="card kpi"><div class="lbl"><span class="ico ${t.c}">${icon(t.i)}</span>${t.n}</div><div class="val num">${fmtMoney(byCurType[k]||0)}</div>
    <div class="delta">${liquidTotal?Math.round((byCurType[k]||0)/liquidTotal*100):0}% ${hasProp?'majątku płynnego':'aktywów'}</div></div>`).join('')}</div>`;
        if (debt || prop) html += `<div class="card card-b mb" style="display:flex;gap:24px;flex-wrap:wrap;align-items:center">
      <div><div class="faint">Aktywa</div><b class="num" style="font-size:18px">${fmtMoney(total)}</b></div>
      ${prop?`<div><div class="faint">w tym nieruchomości</div><b class="num" style="font-size:18px">${fmtMoney(prop)}</b></div><div><div class="faint">Majątek płynny</div><b class="num" style="font-size:18px">${fmtMoney(total-prop)}</b></div>`:''}
      <div><div class="faint">Kredyty</div><b class="num neg" style="font-size:18px">${fmtMoney(debt)}</b></div>
      <div><div class="faint">Wartość netto</div><b class="num" style="font-size:18px">${fmtMoney(total+debt)}</b></div>
      ${debt?`<a class="card-link" data-go="loans" href="#loans" style="margin-left:auto">Szczegóły kredytów ${icon('right')}</a>`:''}</div>`;
        const byType = {};
        S.accounts.forEach(a=>(byType[a.accountType]=byType[a.accountType]||[]).push(a));
        html += Object.keys(ACC_TYPES).filter(k=>byType[k]).map(k=>{
            const t = ACC_TYPES[k], list = byType[k];
            const sums = {}; list.forEach(a=>{ const cu=(a.currency||'').toUpperCase(); sums[cu]=(sums[cu]||0)+num(a.balance); });
            return `<div class="card acc-group"><div class="acc-group-h"><span class="cat-ico ico ${t.c}" style="width:32px;height:32px">${icon(t.i)}</span><h3>${t.n}</h3><b class="num">${Object.entries(sums).map(([cu,v])=>fmtMoney(v,cu)).join(' · ')}</b></div>
      ${list.map(a=>accRow(a)).join('')}</div>`;
        }).join('');
        if (S.archived.length){

            footer:`<button class="btn btn-ghost" data-close>Anuluj</button><button class="btn btn-primary" id="ac-save">${ed?'Zapisz zmiany':'Utwórz konto'}</button>`});

            } catch(err){ toast(err.message,'err'); }

    function adjustModal(id){
        const a = accById(id); if(!a) return;
        const adjCats = S.categories.filter(c=>c.type==='ADJUSTMENT' && usableIn(c, a.groupId));
        const expCats = S.categories.filter(c=>c.type==='EXPENSE' && usableIn(c, a.groupId));
        const m = openModal({title:'Korekta salda', body:`
    <p class="muted" style="margin-bottom:14px">Wpisz rzeczywiste saldo konta <b>${esc(a.name)}</b>. Różnica zostanie zapisana jako transakcja.</p>
    <div class="field"><label>Obecne saldo w aplikacji</label><input class="input num" disabled value="${fmtMoney(a.balance,a.currency)}"></div>
    <div class="field amount-input"><input class="input num" type="number" step="0.01" id="adj-new" placeholder="0,00"><span>${esc(a.currency)}</span></div>
    <div class="fx-preview hidden" id="adj-diff"></div>
    <div class="row"><div class="field"><label>Kategoria</label><select class="input" id="adj-cat"></select></div><div class="field"><label>Podkategoria</label><select class="input" id="adj-sub"></select></div></div>
    <div class="note warn hidden" id="adj-warn"></div>`,
            footer:`<button class="btn btn-ghost" data-close>Anuluj</button><button class="btn btn-primary" id="adj-save">Zapisz korektę</button>`});
        let diff = 0;
        const fill = ()=>{
            const cats = diff>=0 ? adjCats : expCats;
            const cs = $('#adj-cat',m), prev = cs.value;
            cs.innerHTML = cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('') || '<option value="">Brak</option>';
            if (cats.some(c=>String(c.id)===prev)) cs.value = prev;
            fillSub();
        };
        const fillSub = ()=>{
            const cat = S.categories.find(c=>String(c.id)===$('#adj-cat',m).value), subs = cat?subsOf(cat, a.groupId):[];
            $('#adj-sub',m).innerHTML = subOptions(subs);
            const w = $('#adj-warn',m);
            if (diff>=0 && !adjCats.length){ w.textContent = 'Brak kategorii typu „Korekta”. Dodaj ją w zakładce Kategorie.'; w.classList.remove('hidden'); }
            else w.classList.add('hidden');
        };
        $('#adj-new',m).oninput = ()=>{
            const v = $('#adj-new',m).value; const d = $('#adj-diff',m);
            if (v===''){ d.classList.add('hidden'); return; }
            diff = Math.round((num(v)-num(a.balance))*100)/100;
            d.classList.remove('hidden'); d.innerHTML = `<span>${diff>=0?'Korekta w górę (Korekta)':'Korekta w dół (Wydatek)'}</span><span>${diff>=0?'+':''}${fmtMoney(diff,a.currency)}</span>`;
            fill();
        };
        $('#adj-cat',m).onchange = fillSub; fill();
        $('#adj-save',m).onclick = e=>withBtn(e.currentTarget, async ()=>{
            if ($('#adj-new',m).value==='') return toast('Podaj nowe saldo','err');
            if (!diff) return toast('Saldo się nie zmienia','err');
            const categoryId = +$('#adj-cat',m).value, subcategoryId = +$('#adj-sub',m).value || null;
            if (!categoryId) return toast('Wybierz kategorię','err');
            try {
                await api('POST','/api/transactions',{amount:Math.abs(diff), type:diff>0?'ADJUSTMENT':'EXPENSE', accountId:a.id, categoryId, subcategoryId, transactionDate:isoLocal(), description:'Korekta salda'});
                toast('Saldo skorygowane'); closeModal(); await refreshAccounts(); S.allTx=null; rerender();
            } catch(err){ toast(err.message,'err'); }
        });
    }
    async function archiveAccount(id){
        const a = accById(id); if(!a) return;
        if (num(a.balance)!==0) return toast(`Najpierw przenieś ${fmtMoney(a.balance,a.currency)} na inne konto lub skoryguj saldo do zera`,'err');
        if (!await confirmBox({title:`Zarchiwizować „${a.name}”?`, text:'Konto zniknie z listy aktywnych, ale jego historia zostanie w raportach.', okText:'Archiwizuj', danger:false})) return;

    }
    async function unarchiveAccount(id){
        const a = accById(id); if(!a) return;
        try { await api('PATCH',`/api/accounts/${id}/unarchive`); toast(`Konto „${a.name}” przywrócone`); S.allTx=null; viewAccounts(); } catch(err){ toast(err.message,'err'); }

    async function deleteAccount(id){

    async function repOverview(ym){
        const [repR, txR, histR, trR] = await Promise.allSettled([
            api('GET','/api/report/comprehensive'+qs({month:ym.m, year:ym.y})),
            loadAllTx(true),
            api('GET','/api/report/balance-history'+qs({month:ym.m, year:ym.y, months:12})),
            api('GET','/api/transfers'+qs({month:ym.m, year:ym.y})),
        ]);
        if (S.view!=='reports' || S.repTab!=='overview') return;
        const rep = repR.status==='fulfilled' ? repR.value : null;
        const txs = inCur(txR.status==='fulfilled' ? txR.value : []);
        const hist = (histR.status==='fulfilled' ? histR.value||[] : []).filter(h=>!h.currency||h.currency.toUpperCase()===S.currency);
        const key = `${ym.y}-${ym.m}`;
        const mtx = txs.filter(t=>ymKey(t.transactionDate)===key);
        const inc = mtx.filter(t=>t.type==='INCOME').reduce((s,t)=>s+num(t.amount),0);
        const exp = mtx.filter(t=>t.type==='EXPENSE').reduce((s,t)=>s+num(t.amount),0);
        const savRate = inc ? Math.round((inc-exp)/inc*100) : 0;
        const mo = rep?.monthly || {}, cu = rep?.cumulative || {};
        const transfers = trR.status==='fulfilled' ? (trR.value||[]) : [];
        const toSav = transfers.filter(t=>(t.toAccountType==='SAVINGS'||t.toAccountType==='INVESTMENT') && (t.toCurrency||'').toUpperCase()===S.currency).reduce((s,t)=>s+num(t.receivedAmount??t.amount),0);
        const fromSav = transfers.filter(t=>(t.fromAccountType==='SAVINGS'||t.fromAccountType==='INVESTMENT') && (t.fromCurrency||'').toUpperCase()===S.currency).reduce((s,t)=>s+num(t.amount),0);

        const breakdown = type => {
            const m = {};
            mtx.filter(t=>t.type===type).forEach(t=>{ const e = m[t.categoryName] = m[t.categoryName]||{v:0,subs:{}}; e.v+=num(t.amount); const sn = t.subcategoryName||NO_SUB; e.subs[sn]=(e.subs[sn]||0)+num(t.amount); });

        };
        const expB = breakdown('EXPENSE'), incB = breakdown('INCOME');
        const bdHtml = (rows,total) => rows.length ? `<div class="cat-break">${rows.map(([n,e],i)=>{ const col=catColor(n,i), p= total? e.v/total*100 : 0;
                return `<div><div class="cb-top"><span class="dot" style="background:${col};width:10px;height:10px"></span><span class="n">${esc(n)}</span><span class="faint num">${p.toFixed(1)}%</span><b class="num">${fmtMoney(e.v)}</b></div>
      <div class="bar"><span style="width:${p}%;background:${col}"></span></div>
      <div class="subs">${Object.entries(e.subs).sort((a,b)=>b[1]-a[1]).map(([s,v])=>`${esc(s)} ${fmtMoney(v)}`).join(' · ')}</div></div>`; }).join('')}</div>`
            : emptyState('tag','Brak danych','W tym miesiącu nie ma takich transakcji.');

        $('#r-body').innerHTML = `
    <div class="grid g-4 mb">
      <div class="card kpi"><div class="lbl"><span class="ico g">${icon('up')}</span>Przychody</div><div class="val num pos">${fmtMoney(inc)}</div><div class="delta">${mtx.filter(t=>t.type==='INCOME').length} transakcji</div></div>
      <div class="card kpi"><div class="lbl"><span class="ico r">${icon('down')}</span>Wydatki</div><div class="val num neg">${fmtMoney(exp)}</div><div class="delta">${mtx.filter(t=>t.type==='EXPENSE').length} transakcji</div></div>
            <div class="card kpi"><div class="lbl"><span class="ico o">${icon('scale')}</span>Bilans miesiąca</div><div class="val num ${inc-exp>=0?'pos':'neg'}">${fmtMoney(inc-exp)}</div><div class="delta"><span class="chip ${savRate>=0?'g':'r'}">${savRate}%</span> stopa oszczędności</div></div>
      <div class="card kpi"><div class="lbl"><span class="ico a">${icon('piggy')}</span>Na oszczędności</div><div class="val num">${fmtMoney(toSav-fromSav)}</div><div class="delta">wpłaty ${fmtMoney(toSav,null,{compact:true})} · wypłaty ${fmtMoney(fromSav,null,{compact:true})}</div></div>
    </div>
    ${(()=>{ const pr=num(mo.loanPrincipalRepaid), ov=num(mo.loanOverpayments), lc=num(mo.loanCosts), sb=num(mo.loanSubsidy), ds=num(mo.loanDisbursements);
            if (!(pr||ov||lc||sb||ds)) return '';
            return `<div class="card mb"><div class="card-h"><h3>Kredyty w tym miesiącu</h3><span class="faint">kapitał to nie wydatek: pokazujemy go obok</span></div><div class="card-b"><div class="legend">
        ${[['Spłata kapitału (raty)',pr,''],['Nadpłaty',ov,''],['Koszty kredytu (w wydatkach)',lc,'neg'],...(sb?[['Dopłata państwa',sb,'pos']]:[]),...(ds?[['Wypłaty z kredytu',ds,'']]:[]),
                ['Wypływ łącznie (wydatki + kapitał)',mo.totalOutflow,''],['Odłożone i spłacone',mo.wealthBuilt,'pos']]
                .map(([n,v,cl])=>`<div class="legend-i"><span class="n muted">${n}</span><b class="num ${cl}">${fmtMoney(v, cu.balanceCurrency)}</b></div>`).join('')}
        </div></div></div>`; })()}
    <div class="card mb"><div class="card-h"><h3>Przychody i wydatki</h3><span class="faint">12 miesięcy do ${MONTHS_GEN[ym.m-1]} ${ym.y}</span></div><div class="card-b"><div class="chart-box"><canvas id="r-cf"></canvas></div></div></div>
    <div class="grid g-2 mb">
      <div class="card"><div class="card-h"><h3>Wydatki wg kategorii</h3><b class="num">${fmtMoney(exp)}</b></div><div class="card-b">
        ${expB.length?`<div id="r-exp-dd" style="margin-bottom:18px"></div>`:''}${bdHtml(expB,exp)}</div></div>
      <div class="card"><div class="card-h"><h3>Przychody wg kategorii</h3><b class="num">${fmtMoney(inc)}</b></div><div class="card-b">${bdHtml(incB,inc)}</div></div>
    </div>
    <div class="grid g-main mb">
      <div class="card"><div class="card-h"><h3>Struktura majątku</h3><span class="faint">koniec miesiąca</span></div><div class="card-b"><div class="chart-box" id="r-hist-box"><canvas id="r-hist"></canvas></div></div></div>
      <div class="card"><div class="card-h"><h3>Podsumowanie narastające</h3></div><div class="card-b">${rep ? `
        <div class="legend">

    async function viewCategories(){

        $('#c-add').onclick = ()=>catModal();

        catch(err){ toast(err.message,'err'); }

        const groups = S.user?.groups||[];
        if (!groups.some(g=>g.id===S.catGroup)) S.catGroup = groups[0]?.id ?? null;
        const cols = [['EXPENSE','Wydatki','r'],['INCOME','Przychody','g'],['ADJUSTMENT','Korekty','v'],['INITIAL_BALANCE','Saldo początkowe','a']];
        $('#content').innerHTML = `${groups.length>1?`<div class="toolbar"><select class="input" id="c-group">${groups.map(g=>`<option value="${g.id}" ${g.id===S.catGroup?'selected':''}>Grupa: ${esc(g.name)}</option>`).join('')}</select></div>`:''}
    <div class="grid g-2">${cols.map(([k,n,cl])=>{
            const cats = S.categories.filter(c=>c.type===k && usableIn(c, S.catGroup));
