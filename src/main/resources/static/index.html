      ${cats.length ? cats.map(c=>{ const subs = subsOf(c, S.catGroup); const col = /^#[0-9a-f]{6}$/i.test(c.color||'')?c.color:'#888';
                    return `<div class="cat-card"><div class="cat-card-top"><span class="cat-ico" style="background:${hexA(col,.15)};color:${col}">${esc(initials(c.name).slice(0,1))}</span>
          <div class="n">${esc(c.name)}${c.system?' <span class="chip n" style="font-size:11px;padding:0 6px">systemowa</span>':''}${c.description?`<div class="faint" style="font-weight:400;font-size:12.5px">${esc(c.description)}</div>`:''}</div>
          ${c.system?'':`<div class="acts"><button class="icon-btn" title="Edytuj" onclick="catModal(${c.id})">${icon('edit')}</button><button class="icon-btn danger" title="Usuń" onclick="deleteCat(${c.id})">${icon('trash')}</button></div>`}</div>
          <div class="sub-chips">${subs.map(s=>`<span class="sub-chip">${esc(s.name)}${s.system?'':`<button title="Edytuj" onclick="subModal(${s.id})">${icon('edit')}</button><button title="Usuń" onclick="deleteSub(${s.id})">${icon('x')}</button>`}</span>`).join('')}
            <button class="sub-chip add-chip" onclick="subModal(null,${c.id})">+ podkategoria</button></div></div>`; }).join('')
                : `<div class="card-b">${emptyState('tag','Brak kategorii', k==='ADJUSTMENT'?'Kategoria korekt pozwala wyrównywać salda kont.':'Dodaj pierwszą kategorię.', `<button class="btn btn-ghost btn-sm" onclick="catModal(null,'${k}')">${icon('plus')}Dodaj</button>`)}</div>`}
    </div>`; }).join('')}</div>
    <p class="hint" style="margin-top:16px">Kategorie należą do grupy: widzą je i zmieniają tylko jej członkowie. Kategorie systemowe są wspólne i nie da się ich zmienić. Każda transakcja wymaga kategorii; podkategoria jest opcjonalna.</p>`;
        if ($('#c-group')) $('#c-group').onchange = e=>{ S.catGroup = +e.target.value; viewCategories(); };
    }
    function catModal(id, presetType){
        const ed = id ? S.categories.find(c=>c.id===id) : null;
        let color = ed?.color || CAT_SWATCHES[Math.floor(Math.random()*CAT_SWATCHES.length)];
        let type = ed?.type || presetType || 'EXPENSE';
        if (!ed && S.catGroup==null){ toast('Najpierw utwórz grupę','err'); return groupModal(); }
        const m = openModal({title: ed?'Edytuj kategorię':(multiGroup()?'Nowa kategoria · '+groupName(S.catGroup):'Nowa kategoria'), body:`
    <div class="field"><label>Typ</label><div class="seg" id="cat-type">${[['EXPENSE','Wydatek','exp'],['INCOME','Przychód','inc'],['ADJUSTMENT','Korekta','adj']].map(([k,n,c])=>`<button type="button" data-k="${k}" class="${c}" ${ed?'disabled':''}>${n}</button>`).join('')}</div></div>
    <div class="field"><label>Nazwa</label><input class="input" id="cat-name" maxlength="100" value="${esc(ed?.name||'')}" placeholder="np. Jedzenie"></div>
    <div class="field"><label>Kolor</label><div class="colors" id="cat-colors">${CAT_SWATCHES.map(s=>`<button type="button" data-c="${s}" style="background:${s}"></button>`).join('')}<input type="color" id="cat-custom" value="${/^#[0-9a-f]{6}$/i.test(color)?color:'#ff6a3d'}" style="width:28px;height:28px;border:none;background:none;padding:0;cursor:pointer" title="Własny kolor"></div></div>
    <div class="field"><label>Opis</label><input class="input" id="cat-desc" maxlength="255" value="${esc(ed?.description||'')}" placeholder="opcjonalnie"></div>
    ${ed?'':'<div class="field"><label>Pierwsza podkategoria</label><input class="input" id="cat-sub" placeholder="np. Zakupy spożywcze"><span class="hint">Opcjonalnie. Podkategorie możesz dodać też później.</span></div>'}`,
            footer:`<button class="btn btn-ghost" data-close>Anuluj</button><button class="btn btn-primary" id="cat-save">${ed?'Zapisz':'Dodaj kategorię'}</button>`});
        const setC = c=>{ color=c.toUpperCase(); $$('#cat-colors button',m).forEach(b=>b.classList.toggle('on',b.dataset.c.toUpperCase()===color)); };
        const setT = k=>{ type=k; $$('#cat-type button',m).forEach(b=>b.classList.toggle('on',b.dataset.k===k)); };
        $$('#cat-colors button',m).forEach(b=>b.onclick=()=>setC(b.dataset.c));
        $('#cat-custom',m).oninput = e=>setC(e.target.value);
        $$('#cat-type button',m).forEach(b=>b.onclick=()=>setT(b.dataset.k));
        setC(color); setT(type);
        $('#cat-save',m).onclick = e=>withBtn(e.currentTarget, async ()=>{
            const name = $('#cat-name',m).value.trim(), description = $('#cat-desc',m).value.trim();
            if (!name) return toast('Podaj nazwę','err');
            try {
                if (ed) await api('PATCH','/api/categories/'+ed.id,{name, color, description});
                else {
                    const created = await api('POST','/api/categories',{name, color, type, description:description||undefined, groupId:S.catGroup ?? undefined});
                    const sub = $('#cat-sub',m).value.trim();
                    if (sub && created?.id) await api('POST','/api/subcategories',{name:sub, categoryId:created.id});
                }
                toast(ed?'Kategoria zaktualizowana':'Kategoria dodana'); closeModal(); viewCategoriesOrRefresh();
            } catch(err){ toast(err.message,'err'); }
        });
    }
    function subModal(id, categoryId, after){
        const ed = id ? S.subcategories.find(s=>s.id===id) : null;
        const cat = ed ? (S.categories.find(c=>c.id===ed.categoryId) || S.categories.find(c=>c.name===ed.categoryName)) : S.categories.find(c=>c.id===categoryId);
        // Grupa podkategorii: przy edycji jej własna, przy nowej ta wybrana w widoku kategorii.
        const g = ed ? ed.groupId : (S.catGroup ?? (S.user?.groups||[])[0]?.id ?? null);
        // Przy edycji podkategorię można przenieść tylko do kategorii tego samego typu i tej samej grupy (backend przenosi też jej transakcje).
        const catOpts = S.categories.filter(c=> (ed ? (cat && c.type===cat.type) : c.type!=='INITIAL_BALANCE') && usableIn(c, g));
        const m = openModal({title: ed?'Edytuj podkategorię':'Nowa podkategoria', body:`
    <div class="field"><label>Kategoria</label><select class="input" id="sub-cat">${catOpts.map(c=>`<option value="${c.id}" ${cat&&c.id===cat.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>${ed?'<span class="hint">Zmiana kategorii przeniesie też transakcje i stałe wydatki z tą podkategorią.</span>':''}</div>
    <div class="field"><label>Nazwa</label><input class="input" id="sub-name" maxlength="100" value="${esc(ed?.name||'')}"></div>
    <div class="field"><label>Opis</label><input class="input" id="sub-desc" maxlength="255" value="${esc(ed?.description||'')}" placeholder="opcjonalnie"></div>`,
            footer:`<button class="btn btn-ghost" data-close>Anuluj</button><button class="btn btn-primary" id="sub-save">${ed?'Zapisz':'Dodaj'}</button>`});
        $('#sub-save',m).onclick = e=>withBtn(e.currentTarget, async ()=>{
            const name = $('#sub-name',m).value.trim(), description = $('#sub-desc',m).value.trim();
            if (!name) return toast('Podaj nazwę','err');
            try {
                if (ed) await api('PATCH','/api/subcategories/'+ed.id,{name, description, categoryId:+$('#sub-cat',m).value});
                else await api('POST','/api/subcategories',{name, description:description||undefined, categoryId:+$('#sub-cat',m).value, groupId:g ?? undefined});

                if (after) after(); else viewCategoriesOrRefresh();
            } catch(err){ toast(err.message,'err'); }
        });
    }
    // Nowa grupa dostaje domyślne kategorie, a po dołączeniu do grupy widać jej kategorie: wczytujemy je od nowa.
    async function reloadCats(){
        [S.categories, S.subcategories] = await Promise.all([api('GET','/api/categories'), api('GET','/api/subcategories')]);
        S.categories ||= []; S.subcategories ||= [];
    }
    async function viewCategoriesOrRefresh(){
        if (S.view==='categories') return viewCategories();
        [S.categories, S.subcategories] = await Promise.all([api('GET','/api/categories'), api('GET','/api/subcategories')]);
    }
    async function deleteCat(id){

        try { await api('DELETE','/api/categories/'+id); toast('Kategoria usunięta'); viewCategories(); } catch(err){ toast(err.message,'err'); }
    }
    async function deleteSub(id){
        const s = S.subcategories.find(x=>x.id===id);
        if (!await confirmBox({title:`Usunąć podkategorię „${s?.name}”?`, text:'Nie da się usunąć podkategorii używanej w transakcjach.'})) return;
        try { await api('DELETE','/api/subcategories/'+id); toast('Podkategoria usunięta'); viewCategories(); } catch(err){ toast(err.message,'err'); }
    }

    /* =========================================================
       SHARED HELPERS (budżety, cykliczne, cele, eksport)
       ========================================================= */
    const FREQ = {WEEKLY:'Co tydzień', BIWEEKLY:'Co 2 tygodnie', MONTHLY:'Co miesiąc', QUARTERLY:'Co kwartał', YEARLY:'Co rok'};
    const BSTAT = {OK:{n:'W normie',c:'g',v:'--green'}, WARNING:{n:'Blisko limitu',c:'a',v:'--amber'}, EXCEEDED:{n:'Przekroczony',c:'r',v:'--red'}};
    const todayIso = () => isoLocal(new Date());
    function daysBetween(a,b){ return Math.round((parseDate(b)-parseDate(a))/864e5); }
    function fmtShort(d){ const x=parseDate(d); return x ? x.toLocaleDateString('pl-PL',{day:'numeric',month:'short'}) : '—'; }
    function relDay(d){
        const n = daysBetween(todayIso(), d);
        if (n===0) return 'dziś'; if (n===1) return 'jutro'; if (n===-1) return 'wczoraj';
        return n>0 ? `za ${n} dni` : `${-n} dni temu`;
    }
    function mixHex(a, b, t){
        const p = h=>{ const m=/^#?([0-9a-f]{6})$/i.exec((h||'').trim()); const n=m?parseInt(m[1],16):0x888888; return [n>>16,(n>>8)&255,n&255]; };
        const x=p(a), y=p(b); return '#'+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,'0')).join('');
    }
    function catIco(name, size=36){ const col = catColor(name); return `<span class="cat-ico" style="width:${size}px;height:${size}px;background:${hexA(col,.14)};color:${col}">${esc(initials(name).slice(0,1))}</span>`; }
    function monthRange(ym){ const s=new Date(ym.y,ym.m-1,1), e=new Date(ym.y,ym.m,0); return {from:isoLocal(s), to:isoLocal(e), days:e.getDate()}; }
    function monthNavHtml(id, ym, allowFuture=false){
        return `<div class="month-nav"><button class="icon-btn" id="${id}-prev">${icon('left')}</button><b>${monthLabel(ym)}</b><button class="icon-btn" id="${id}-next" ${!allowFuture&&isFuture(shiftMonth(ym,1))?'disabled':''}>${icon('right')}</button></div>`;
    }

    async function refreshBudgetAlerts(){
        try {

        } catch { S.budgets=[]; S.budgetAlerts=0; S.budgetWarn=0; }

    async function checkBudgetAfterExpense(categoryId, date){
        if (ymKey(date)!==`${now.getFullYear()}-${now.getMonth()+1}`) { refreshBudgetAlerts(); return; }
        await refreshBudgetAlerts();
        S.budgets.filter(b=>b.categoryId===categoryId && b.status!=='OK').forEach(b=>{
            if (b.status==='EXCEEDED') toast(`Przekroczono budżet „${b.categoryName}” o ${fmtMoney(-num(b.remaining), b.currency)}`, 'warn');
            else toast(`Budżet „${b.categoryName}” wykorzystany w ${Math.round(num(b.percent))}%`, 'warn');
        });
    }

    /* drill-down donut: categories -> subcategories */
    const drillState = {};
    function drillDonut(boxId, key, txs, {height=190, legend=true, legendMax=6}={}){
        const box = document.getElementById(boxId); if (!box) return;
        const st = drillState[key] = drillState[key] || {cat:null};
        const exp = txs.filter(t=>t.type==='EXPENSE');
        if (st.cat && !exp.some(t=>t.categoryName===st.cat)) st.cat = null;
        const agg = {};
        (st.cat ? exp.filter(t=>t.categoryName===st.cat) : exp).forEach(t=>{ const n = st.cat ? (t.subcategoryName||NO_SUB) : t.categoryName; agg[n]=(agg[n]||0)+num(t.amount); });
        const rows = Object.entries(agg).sort((a,b)=>b[1]-a[1]);
        const total = rows.reduce((s,r)=>s+r[1],0);
        if (!rows.length){ box.innerHTML = emptyState('tag','Brak wydatków','W tym okresie nie ma wydatków.'); return; }
        const surface = cssVar('--surface');
        const base = st.cat ? catColor(st.cat) : null;
        const colors = rows.map((r,i)=> st.cat ? mixHex(base, surface, rows.length>1 ? i/(rows.length)*0.7 : 0) : catColor(r[0],i));
        box.innerHTML = `
    <div class="crumb">${st.cat ? `<button data-back>${icon('left')}Wszystkie</button><span class="faint">/</span><b>${esc(st.cat)}</b>` : `<span class="faint">Kliknij kategorię, aby zobaczyć podkategorie</span>`}</div>
    <div class="chart-box sm" style="height:${height}px"><canvas></canvas>
      <div style="position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center"><div><div class="faint" style="font-size:12px">${st.cat?esc(st.cat):'Razem'}</div><div style="font-weight:700;font-size:18px" class="num">${fmtMoney(total,null,{compact:true})}</div></div></div></div>
    ${legend ? `<div class="legend legend-click" style="margin-top:14px">${rows.slice(0,legendMax).map(([n,v],i)=>`<div class="legend-i" data-n="${esc(n)}"><span class="dot" style="background:${colors[i]}"></span><span class="n">${esc(n)}</span><span class="num faint">${total?Math.round(v/total*100):0}%</span><b class="num">${fmtMoney(v)}</b></div>`).join('')}${rows.length>legendMax?`<div class="hint">+ ${rows.length-legendMax} więcej</div>`:''}</div>` : ''}`;
        const drill = n=>{ if (!st.cat){ st.cat = n; drillDonut(boxId, key, txs, {height, legend, legendMax}); } };
        const back = box.querySelector('[data-back]'); if (back) back.onclick = ()=>{ st.cat=null; drillDonut(boxId, key, txs, {height, legend, legendMax}); };
        box.querySelectorAll('.legend-i[data-n]').forEach(el=>el.onclick=()=>drill(el.dataset.n));
        mkChart(key, box.querySelector('canvas'), {type:'doughnut', data:{labels:rows.map(r=>r[0]), datasets:[{data:rows.map(r=>r[1]), backgroundColor:colors, borderColor:surface, borderWidth:2, hoverOffset:6}]},
            options:{responsive:true, maintainAspectRatio:false, cutout:'72%', onClick:(e,els)=>{ if (els.length) drill(rows[els[0].index][0]); },
                onHover:(e,els)=>{ e.native.target.style.cursor = (!st.cat && els.length) ? 'pointer' : 'default'; },
                plugins:{legend:{display:false}, tooltip:{...tooltipStyle(), callbacks:{label:c=>` ${c.label}: ${fmtMoney(c.raw)} (${total?Math.round(c.raw/total*100):0}%)`}}}}});
    }

    /* file download with bearer token */
    async function downloadFile(path, fallbackName){
        let res;
        try { res = await fetch(API+path, {headers: token ? {Authorization:'Bearer '+token} : {}}); }
        catch { throw new Error('Brak połączenia z serwerem'); }
        if (res.status===401){ logout(true,true); throw new Error('Sesja wygasła. Zaloguj się ponownie.'); }
        if (!res.ok){ let msg=''; try { msg = (await res.json()).message; } catch {} throw new Error(translateError(msg||`Błąd serwera (${res.status})`, res.status)); }
        const blob = await res.blob();
        const m = /filename\*?=(?:UTF-8'')?"?([^";]+)"?/i.exec(res.headers.get('Content-Disposition')||'');
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = m ? decodeURIComponent(m[1]) : fallbackName;
        document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    }

        let fmt='xlsx', rng='year';
        const m = openModal({title:'Eksport danych', body:`
    <div class="field"><label>Format</label><div class="seg" id="ex-fmt"><button data-k="xlsx">Excel (.xlsx)</button><button data-k="csv">CSV</button></div>
      <span class="hint" id="ex-hint"></span></div>
    <div class="field"><label>Okres</label><div class="seg" id="ex-rng" style="flex-wrap:wrap">${Object.entries(ranges).map(([k,v])=>`<button data-k="${k}">${v[0]}</button>`).join('')}</div></div>
    <div class="row hidden" id="ex-custom"><div class="field"><label>Od</label><input class="input" type="date" id="ex-from" value="${cm.from}"></div><div class="field"><label>Do</label><input class="input" type="date" id="ex-to" value="${cm.to}"></div></div>
    ${groups.length?`<div class="field"><label>Zakres</label><select class="input" id="ex-scope"><option value="">Tylko moje transakcje</option>${groups.map(g=>`<option value="${g.id}">Grupa: ${esc(g.name)}</option>`).join('')}</select></div>`:''}`,
            footer:`<button class="btn btn-ghost" data-close>Anuluj</button><button class="btn btn-primary" id="ex-go">${icon('download')}Pobierz</button>`});
        const upd = ()=>{
            $$('#ex-fmt button',m).forEach(b=>b.classList.toggle('on',b.dataset.k===fmt));
            $$('#ex-rng button',m).forEach(b=>b.classList.toggle('on',b.dataset.k===rng));
            $('#ex-custom',m).classList.toggle('hidden', rng!=='custom');
            $('#ex-hint',m).textContent = fmt==='xlsx' ? 'Arkusze: Transakcje, Podsumowanie miesięczne i Przelewy.' : 'Same transakcje, separator „;”, kodowanie UTF-8 (otworzysz w Excelu).';
        };
        $$('#ex-fmt button',m).forEach(b=>b.onclick=()=>{ fmt=b.dataset.k; upd(); });
        $$('#ex-rng button',m).forEach(b=>b.onclick=()=>{ rng=b.dataset.k; upd(); }); upd();
        $('#ex-go',m).onclick = e=>withBtn(e.currentTarget, async ()=>{
            const [,from,to] = rng==='custom' ? [0,$('#ex-from',m).value,$('#ex-to',m).value] : ranges[rng];
            if (rng==='custom' && from && to && to<from) return toast('Data „do” jest wcześniejsza niż „od”','err');
            try { await downloadFile('/api/export/transactions'+qs({format:fmt, from, to, groupId:$('#ex-scope',m)?.value}), `budgetmanager.${fmt}`); toast('Plik pobrany'); closeModal(); }
            catch(err){ toast(err.message,'err'); }
        });
    }

    function budgetRow(b, pace){
        const st = BSTAT[b.status]||BSTAT.OK, p = num(b.percent), rem = num(b.remaining);
        const perDay = pace!=null && rem>0 ? rem / Math.max(1, monthRange({m:b.month,y:b.year}).days - now.getDate() + 1) : null;
        return `<div class="budget-row">
    <div class="top">${catIco(b.categoryName,32)}<span class="n">${esc(b.categoryName)}</span>
      <span class="chip ${st.c}">${b.status==='OK'?'':icon('alert')}${st.n}</span>
      <span class="num" style="text-align:right"><b>${fmtMoney(b.spent,b.currency)}</b> <span class="faint">/ ${fmtMoney(b.amount,b.currency)}</span></span>
      <div class="acts"><button class="icon-btn" title="Zmień limit" onclick="budgetModal(${b.id})">${icon('edit')}</button><button class="icon-btn danger" title="Usuń" onclick="deleteBudget(${b.id})">${icon('trash')}</button></div></div>
    <div class="pbar" title="${p}% budżetu"><span style="width:${Math.min(p,100)}%;background:var(${st.v})"></span>${pace!=null?`<i class="pace" style="left:${pace}%" title="Dzisiejsze tempo: ${Math.round(pace)}% miesiąca"></i>`:''}</div>
    <div class="meta"><span>${p.toLocaleString('pl-PL')}% wykorzystane</span><span class="${rem<0?'neg':''}">${rem>=0?`Zostało ${fmtMoney(rem,b.currency)}${perDay!=null?` · ok. ${fmtMoney(perDay,b.currency)} dziennie`:''}`:`Przekroczono o ${fmtMoney(-rem,b.currency)}`}</span></div>
  </div>`;
    }
    async function viewBudgets(){
        setHeader('Budżety', 'Miesięczne limity wydatków na kategorie', `${currencySelect()}<button class="btn btn-primary" id="b-add">${icon('plus')}Nowy budżet</button>`);
        bindCurrencySelect(); $('#b-add').onclick = ()=>budgetModal();
        const ym = S.budMonth, c = $('#content');
        c.innerHTML = `<div class="toolbar">${monthNavHtml('b', ym, true)}</div><div id="b-body">${skeleton(4)}</div>`;
        $('#b-prev').onclick = ()=>{ S.budMonth = shiftMonth(S.budMonth,-1); viewBudgets(); };
        $('#b-next').onclick = ()=>{ S.budMonth = shiftMonth(S.budMonth,1); viewBudgets(); };
        const [bR, txR] = await Promise.allSettled([api('GET','/api/budgets'+qs({month:ym.m, year:ym.y})), loadAllTx()]);
        if (S.view!=='budgets') return;
        if (bR.status==='rejected'){ $('#b-body').innerHTML = `<div class="card">${emptyState('target','Nie udało się wczytać budżetów', esc(bR.reason.message))}</div>`; return; }
        const all = bR.value||[];
        const isCur = ym.m===now.getMonth()+1 && ym.y===now.getFullYear();
        if (isCur){ S.budgets = all; S.budgetAlerts = all.filter(b=>b.status==='EXCEEDED').length; S.budgetWarn = all.filter(b=>b.status==='WARNING').length; renderNav(); }
        const list = all.filter(b=>b.currency===S.currency), other = all.filter(b=>b.currency!==S.currency);
        const days = monthRange(ym).days, pace = isCur ? now.getDate()/days*100 : null;
        const tot = list.reduce((s,b)=>s+num(b.amount),0), spent = list.reduce((s,b)=>s+num(b.spent),0);
        const totPct = tot ? spent/tot*100 : 0;
        // categories without budget
        const txs = inCur(txR.status==='fulfilled' ? txR.value : []).filter(t=>t.type==='EXPENSE');
        const keyOf = d=>ymKey(d), cur = `${ym.y}-${ym.m}`, prev3 = [1,2,3].map(i=>{ const p=shiftMonth(ym,-i); return `${p.y}-${p.m}`; });
        const budgeted = new Set(list.map(b=>b.categoryId));
        const unb = S.categories.filter(c=>c.type==='EXPENSE' && !budgeted.has(c.id)).map(c=>{
            const ct = txs.filter(t=>t.categoryId!=null ? t.categoryId===c.id : t.categoryName===c.name);
            const now_ = ct.filter(t=>keyOf(t.transactionDate)===cur).reduce((s,t)=>s+num(t.amount),0);
            const avg = ct.filter(t=>prev3.includes(keyOf(t.transactionDate))).reduce((s,t)=>s+num(t.amount),0)/3;
            return {c, now:now_, avg};
        }).filter(x=>x.now>0||x.avg>0).sort((a,b)=>b.avg-a.avg||b.now-a.now);
        const exceeded = list.filter(b=>b.status==='EXCEEDED'), warn = list.filter(b=>b.status==='WARNING');
        $('#b-body').innerHTML = `
    ${exceeded.length?`<div class="alert r">${icon('alert')}<div class="grow"><b>Przekroczone budżety (${exceeded.length}):</b> ${exceeded.map(b=>`${esc(b.categoryName)} <span class="num">+${fmtMoney(-num(b.remaining),b.currency)}</span>`).join(', ')}</div></div>`:''}
    ${warn.length?`<div class="alert a">${icon('alert')}<div class="grow"><b>Blisko limitu:</b> ${warn.map(b=>`${esc(b.categoryName)} (${Math.round(num(b.percent))}%)`).join(', ')}</div></div>`:''}
    <div class="grid g-4 mb">
      <div class="card kpi"><div class="lbl"><span class="ico o">${icon('target')}</span>Budżet na miesiąc</div><div class="val num">${fmtMoney(tot)}</div><div class="delta">${list.length} ${list.length===1?'kategoria':'kategorii'}</div></div>
      <div class="card kpi"><div class="lbl"><span class="ico r">${icon('down')}</span>Wydano</div><div class="val num">${fmtMoney(spent)}</div><div class="delta"><span class="chip ${totPct>100?'r':totPct>=80?'a':'g'}">${Math.round(totPct)}%</span> budżetu</div></div>
      <div class="card kpi"><div class="lbl"><span class="ico g">${icon('wallet')}</span>${tot-spent>=0?'Zostało':'Ponad budżet'}</div><div class="val num ${tot-spent<0?'neg':''}">${fmtMoney(Math.abs(tot-spent))}</div><div class="delta">${isCur&&tot-spent>0?`ok. ${fmtMoney((tot-spent)/(days-now.getDate()+1))} dziennie do końca miesiąca`:'&nbsp;'}</div></div>
      <div class="card kpi"><div class="lbl"><span class="ico b">${icon('calendar')}</span>Tempo wydatków</div><div class="val num">${isCur?`${now.getDate()} / ${days} dni`:'—'}</div><div class="delta">${isCur&&tot?(totPct<=pace?`<span class="chip g">wolniej niż plan</span>`:`<span class="chip r">szybciej niż plan</span>`)+` plan: ${Math.round(pace)}%`:'miesiąc zakończony'}</div></div>
    </div>
    <div class="card mb"><div class="card-h"><h3>Budżety · ${monthLabel(ym)}</h3>${pace!=null?`<span class="faint" style="font-size:12.5px;display:inline-flex;align-items:center;gap:6px"><i style="display:inline-block;width:2px;height:12px;background:var(--text-3)"></i>dzisiejsze tempo</span>`:''}</div>
      <div style="padding:8px 0">${list.length ? list.map(b=>budgetRow(b,pace)).join('') : emptyState('target','Brak budżetów w '+S.currency,'Ustaw miesięczny limit na kategorię, a aplikacja ostrzeże Cię przed jego przekroczeniem.',`<button class="btn btn-primary btn-sm" onclick="budgetModal()">${icon('plus')}Nowy budżet</button>`)}</div></div>
    ${other.length?`<div class="card mb"><div class="card-h"><h3>Budżety w innych walutach</h3></div><div style="padding:8px 0">${other.map(b=>budgetRow(b,pace)).join('')}</div></div>`:''}
    ${unb.length?`<div class="card"><div class="card-h"><h3>Kategorie bez budżetu</h3><span class="faint">sugestia = średnia z 3 poprzednich miesięcy</span></div>
      <div class="list" style="padding:8px 0">${unb.map(x=>{ const sug = Math.max(10, Math.ceil(x.avg/10)*10);
            return `<div class="li">${catIco(x.c.name,32)}<div class="main-t"><div class="t1">${esc(catLabel(x.c))}</div><div class="t2">w tym miesiącu ${fmtMoney(x.now)} · średnio ${fmtMoney(x.avg)}</div></div>
        <button class="btn btn-ghost btn-sm" onclick="budgetModal(null,{categoryId:${x.c.id},amount:${sug}})">${icon('plus')}Ustaw ${fmtMoney(sug,null,{compact:true})}</button></div>`; }).join('')}</div></div>`:''}`;
    }
    function budgetModal(id, preset={}){
        const ed = id ? (S.budgets.find(b=>b.id===id) || null) : null;
        const edAny = ed || (id ? {id} : null);
        const cats = S.categories.filter(c=>c.type==='EXPENSE');
        if (!cats.length){ toast('Najpierw dodaj kategorię wydatków','err'); return; }
        const used = new Set(S.budgets.filter(b=>b.currency===S.currency).map(b=>b.categoryId));
        const avail = edAny ? cats : cats.filter(c=>!used.has(c.id) || c.id===preset.categoryId);
        if (!edAny && !avail.length){ toast('Wszystkie kategorie wydatków mają już budżet','err'); return; }
        const cs = currencies().length ? currencies() : ['PLN'];
        const m = openModal({title: edAny?'Zmień budżet':'Nowy budżet', body:`
        <div class="field"><label>Kategoria</label><select class="input" id="bu-cat" ${edAny?'disabled':''}>${(edAny&&ed?cats.filter(c=>c.id===ed.categoryId):avail).map(c=>`<option value="${c.id}" ${c.id===(ed?.categoryId??preset.categoryId)?'selected':''}>${esc(catLabel(c))}</option>`).join('')}</select></div>
    <div class="field amount-input"><input class="input num" type="number" step="1" min="1" id="bu-amt" placeholder="0" value="${ed?num(ed.amount):(preset.amount||'')}"><span id="bu-cur">${esc(ed?.currency||S.currency)}</span></div>
    ${edAny?'':`<div class="field"><label>Waluta</label><select class="input" id="bu-c">${cs.map(c=>`<option ${c===S.currency?'selected':''}>${c}</option>`).join('')}</select><span class="hint">Liczą się wydatki z kont w tej walucie.</span></div>`}
    <div class="note" id="bu-hint"></div>`,
            footer:`<button class="btn btn-ghost" data-close>Anuluj</button><button class="btn btn-primary" id="bu-save">${edAny?'Zapisz':'Utwórz budżet'}</button>`});
        const hint = async ()=>{
            const cat = S.categories.find(c=>String(c.id)===$('#bu-cat',m).value); if (!cat) return;
            const cur = $('#bu-c',m)?.value || ed?.currency || S.currency; $('#bu-cur',m).textContent = cur;
            const txs = (await loadAllTx()).filter(t=>t.type==='EXPENSE' && t.categoryName===cat.name && accCur(t.accountId)===cur);
            const ms = [1,2,3].map(i=>{ const p=shiftMonth({m:now.getMonth()+1,y:now.getFullYear()},-i); return `${p.y}-${p.m}`; });
            const avg = txs.filter(t=>ms.includes(ymKey(t.transactionDate))).reduce((s,t)=>s+num(t.amount),0)/3;
            const mx = Math.max(0,...ms.map(k=>txs.filter(t=>ymKey(t.transactionDate)===k).reduce((s,t)=>s+num(t.amount),0)));
            $('#bu-hint',m).innerHTML = avg ? `Średnie wydatki w ostatnich 3 miesiącach: <b>${fmtMoney(avg,cur)}</b> miesięcznie (najwięcej ${fmtMoney(mx,cur)}).` : 'Brak wydatków w tej kategorii w ostatnich 3 miesiącach.';
        };
        $('#bu-cat',m).onchange = hint; if ($('#bu-c',m)) $('#bu-c',m).onchange = hint; hint();
        $('#bu-save',m).onclick = e=>withBtn(e.currentTarget, async ()=>{
            const amount = num($('#bu-amt',m).value); if (!(amount>0)) return toast('Podaj kwotę większą od zera','err');
            try {
                if (edAny) await api('PATCH','/api/budgets/'+edAny.id,{amount});
                else await api('POST','/api/budgets',{categoryId:+$('#bu-cat',m).value, amount, currency:$('#bu-c',m).value});
                toast(edAny?'Budżet zaktualizowany':'Budżet utworzony'); closeModal();
                await refreshBudgetAlerts(); if (S.view==='budgets') viewBudgets(); else rerender();
            } catch(err){ toast(/already exists/i.test(err.message)?'Ta kategoria ma już budżet w tej walucie.':err.message,'err'); }
        });
    }
    async function deleteBudget(id){
        const b = S.budgets.find(x=>x.id===id);
        if (!await confirmBox({title:`Usunąć budżet${b?` „${b.categoryName}”`:''}?`, text:'Transakcje pozostaną bez zmian, zniknie tylko limit.'})) return;
        try { await api('DELETE','/api/budgets/'+id); toast('Budżet usunięty'); await refreshBudgetAlerts(); viewBudgets(); } catch(err){ toast(err.message,'err'); }
    }

        <button class="btn btn-ghost btn-sm" onclick="skipRecurring(${r.id})">${icon('skip')}Pomiń</button><button class="btn btn-primary btn-sm" onclick="postRecurring(${r.id})">${icon('check')}Zaksięguj</button></div>`).join('')}</div></div>`:''}
    <div class="grid g-4 mb">
      <div class="card kpi"><div class="lbl"><span class="ico r">${icon('repeat')}</span>Stałe wydatki / mies.</div><div class="val num">${fmtMoney(mExp)}</div><div class="delta">${act.filter(r=>r.type==='EXPENSE').length} aktywnych płatności</div></div>
      <div class="card kpi"><div class="lbl"><span class="ico g">${icon('up')}</span>Stałe przychody / mies.</div><div class="val num pos">${fmtMoney(mInc)}</div><div class="delta">${act.filter(r=>r.type==='INCOME').length} źródeł</div></div>
      <div class="card kpi"><div class="lbl"><span class="ico o">${icon('scale')}</span>Zostaje po stałych</div><div class="val num ${mInc-mExp<0?'neg':''}">${fmtMoney(mInc-mExp)}</div><div class="delta">${mInc?Math.round(mExp/mInc*100)+'% przychodów idzie na stałe opłaty':'&nbsp;'}</div></div>
      <div class="card kpi"><div class="lbl"><span class="ico b">${icon('calendar')}</span>Najbliższa płatność</div><div class="val num" style="font-size:20px">${nextOne?fmtMoney(nextOne.amount,nextOne.currency):'—'}</div><div class="delta">${nextOne?`${esc(nextOne.description)} · ${fmtShort(nextOne.date)} (${relDay(nextOne.date)})`:'brak w ciągu 30 dni'}</div></div>
    </div>
    <div class="grid g-main mb">
      <div class="card"><div class="card-h"><h3>Kalendarz płatności</h3>${monthNavHtml('rc', ym, true)}</div>
        <div class="card-b"><div class="cal">${['Pn','Wt','Śr','Cz','Pt','So','Nd'].map(d=>`<div class="dow">${d}</div>`).join('')}
        ${cells.map(d=>{ const iso=isoLocal(d), ev=byDay[iso]||[], out=d.getMonth()!==ym.m-1;
            return `<div class="day ${out?'out':''} ${iso===t?'today':''}" title="${esc(ev.map(e=>`${e.description}: ${fmtMoney(e.amount,e.currency)}`).join('\n'))}"><span class="d">${d.getDate()}</span>
          ${ev.slice(0,3).map(e=>`<span class="ev ${e.type==='INCOME'?'inc':'exp'} ${e.overdue?'over':''}" onclick="recurringModal(${e.recurringId})" style="cursor:pointer">${esc(e.description)}<br><span class="num" style="font-weight:500">${e.type==='INCOME'?'+':'−'}${fmtMoney(e.amount,e.currency,{compact:true})}</span></span>`).join('')}${ev.length>3?`<span class="faint" style="font-size:11px">+${ev.length-3}</span>`:''}</div>`; }).join('')}
        </div></div></div>
      <div class="card"><div class="card-h"><h3>Najbliższe 30 dni</h3><span class="faint num">−${fmtMoney(next30.filter(u=>u.type==='EXPENSE'&&u.currency===S.currency).reduce((s,u)=>s+num(u.amount),0))}</span></div>

          <span class="cat-ico" style="background:var(--surface-2);color:var(--text-2);flex-direction:column;font-size:11px;line-height:1.05;display:flex;align-items:center;justify-content:center"><b style="font-size:14px">${parseDate(u.date).getDate()}</b>${MSHORT[parseDate(u.date).getMonth()].toLowerCase()}</span>
          <div class="main-t"><div class="t1">${esc(u.description)}</div><div class="t2">${relDay(u.date)} · ${esc(u.categoryName)}${u.autoPost?' · auto':''}</div></div>
          <div class="amt num ${u.type==='INCOME'?'pos':''}">${u.type==='INCOME'?'+':'−'}${fmtMoney(u.amount,u.currency)}</div></div>`).join('') : emptyState('calendar','Nic w najbliższym czasie','Dodaj czynsz, subskrypcje lub pensję.')}</div></div>
    </div>
    <div class="card"><div class="card-h" style="padding-bottom:8px"><h3>Wszystkie płatności cykliczne</h3><span class="faint">${list.length}</span></div>
      <div class="list" style="padding-bottom:8px">${list.length ? list.map(r=>`<div class="li hov rec-li" style="${r.active?'':'opacity:.55'}">${catIco(r.categoryName,32)}
        <div class="main-t"><div class="t1">${esc(r.description||r.subcategoryName||r.categoryName)} ${r.autoPost?'<span class="chip b" style="font-size:11px;padding:0 6px">auto</span>':''} ${r.active?'':'<span class="chip n" style="font-size:11px;padding:0 6px">wstrzymana</span>'}</div>
          <div class="t2">${FREQ[r.frequency]||r.frequency} · ${esc(r.categoryName)}${r.subcategoryName?' / '+esc(r.subcategoryName):''} · ${esc(r.accountName)}${r.active?` · następna ${fmtDate(r.nextDate)}`:''}${r.endDate?` · do ${fmtDate(r.endDate)}`:''}</div></div>
        <div class="amt num ${r.type==='INCOME'?'pos':''}">${r.type==='INCOME'?'+':'−'}${fmtMoney(r.amount,r.currency)}</div>
        <div class="acts">${r.active?`<button class="icon-btn" title="Zaksięguj teraz" onclick="postRecurring(${r.id})">${icon('check')}</button><button class="icon-btn" title="Pomiń najbliższą" onclick="skipRecurring(${r.id})">${icon('skip')}</button>`:''}
          <button class="icon-btn" title="${r.active?'Wstrzymaj':'Wznów'}" onclick="toggleRecurring(${r.id},${!r.active})">${icon(r.active?'pause':'play')}</button>
          <button class="icon-btn" title="Edytuj" onclick="recurringModal(${r.id})">${icon('edit')}</button><button class="icon-btn danger" title="Usuń" onclick="deleteRecurring(${r.id})">${icon('trash')}</button></div></div>`).join('')
            : emptyState('repeat','Brak płatności cyklicznych','Dodaj czynsz, rachunki, subskrypcje albo pensję. Możesz też kliknąć ikonę powtarzania przy transakcji.',`<button class="btn btn-primary btn-sm" onclick="recurringModal()">${icon('plus')}Nowa płatność</button>`)}</div></div>`;
        $('#rc-prev').onclick = ()=>{ S.recMonth = shiftMonth(S.recMonth,-1); viewRecurring(); };
        $('#rc-next').onclick = ()=>{ S.recMonth = shiftMonth(S.recMonth,1); viewRecurring(); };
    }
    function recurringModal(id, preset){
        const ed = id ? S.recurring.find(r=>r.id===id) : null;
        if (id && !ed){ api('GET','/api/recurring').then(l=>{ S.recurring=l||[]; if (S.recurring.some(r=>r.id===id)) recurringModal(id); }).catch(e=>toast(e.message,'err')); return; }
        const accs = spendAccs(); if (!accs.length){ toast('Najpierw utwórz konto','err'); return accountModal(); }
        const p = ed || preset || {};
        let type = p.type || 'EXPENSE';
        const nextMonth = d=>{ const x=parseDate(d)||new Date(); const n=new Date(x.getFullYear(), x.getMonth()+1, 1); n.setDate(Math.min(x.getDate(), new Date(n.getFullYear(), n.getMonth()+1, 0).getDate())); return isoLocal(n); };
        const start = ed ? ed.nextDate : (p.startDate || nextMonth(todayIso()));
        const m = openModal({title: ed?'Edytuj płatność cykliczną':'Nowa płatność cykliczna', body:`
    <div class="seg" id="rc-type" style="margin-bottom:16px"><button type="button" data-k="EXPENSE" class="exp">Wydatek</button><button type="button" data-k="INCOME" class="inc">Przychód</button></div>
    <div class="field amount-input"><input class="input num" id="rc-amt" type="number" step="0.01" min="0.01" placeholder="0,00" value="${p.amount?num(p.amount):''}"><span id="rc-cur">PLN</span></div>
    <div class="field"><label>Nazwa / opis</label><input class="input" id="rc-desc" maxlength="255" placeholder="np. Czynsz, Netflix, Pensja" value="${esc(p.description||'')}"></div>
    <div class="row"><div class="field"><label>Kategoria</label><select class="input" id="rc-cat"></select></div><div class="field"><label>Podkategoria</label><select class="input" id="rc-sub"></select></div></div>
    <div class="row"><div class="field"><label>Konto</label><select class="input" id="rc-acc">${accs.map(a=>`<option value="${a.id}" ${String(a.id)===String(p.accountId)?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Częstotliwość</label><select class="input" id="rc-freq">${Object.entries(FREQ).map(([k,n])=>`<option value="${k}" ${k===(p.frequency||'MONTHLY')?'selected':''}>${n}</option>`).join('')}</select></div></div>
    <div class="row"><div class="field"><label>${ed?'Następna płatność':'Pierwsza płatność'}</label><input class="input" type="date" id="rc-start" value="${start}"></div>
      <div class="field"><label>Koniec (opcjonalnie)</label><input class="input" type="date" id="rc-end" value="${p.endDate||''}"></div></div>
    <label class="switch"><div><b style="font-weight:600">Księguj automatycznie</b><div class="hint">W dniu płatności transakcja doda się sama. Bez tego zobaczysz ją jako zaległą do potwierdzenia.</div></div><input type="checkbox" id="rc-auto" ${p.autoPost?'checked':''}></label>`,
            footer:`${ed?`<button class="btn btn-soft-danger" id="rc-del" style="margin-right:auto">${icon('trash')}Usuń</button>`:''}<button class="btn btn-ghost" data-close>Anuluj</button><button class="btn btn-primary" id="rc-save">${ed?'Zapisz':'Dodaj płatność'}</button>`});
        const fillSubs = ()=>{ const cat = S.categories.find(c=>String(c.id)===$('#rc-cat',m).value), subs = cat?subsOf(cat, accGroup($('#rc-acc',m).value)):[];
            $('#rc-sub',m).innerHTML = subOptions(subs, p.subcategoryId); };
        const setType = k=>{ type=k; $$('#rc-type button',m).forEach(b=>b.classList.toggle('on',b.dataset.k===k));
            const cs = $('#rc-cat',m), prev = cs.value, g = accGroup($('#rc-acc',m).value);
            const cats = S.categories.filter(c=>c.type===k && usableIn(c, g));
            cs.innerHTML = cats.map(c=>`<option value="${c.id}" ${c.id===p.categoryId?'selected':''}>${esc(c.name)}</option>`).join('') || '<option value="">Brak kategorii</option>';
            if (cats.some(c=>String(c.id)===prev)) cs.value = prev;
            fillSubs(); };
        const updCur = ()=>{ $('#rc-cur',m).textContent = accCur($('#rc-acc',m).value)||'PLN'; };
        $$('#rc-type button',m).forEach(b=>{ b.onclick=()=>{ if(!ed) setType(b.dataset.k); }; if (ed) b.disabled = b.dataset.k!==ed.type; });
        $('#rc-cat',m).onchange = fillSubs; $('#rc-acc',m).onchange = ()=>{ updCur(); setType(type); }; setType(type); updCur();
        if (ed) $('#rc-del',m).onclick = ()=>{ closeModal(); deleteRecurring(ed.id); };
        $('#rc-save',m).onclick = e=>withBtn(e.currentTarget, async ()=>{
            const amount = num($('#rc-amt',m).value), categoryId = +$('#rc-cat',m).value||null, subcategoryId = +$('#rc-sub',m).value||null;
            const startDate = $('#rc-start',m).value, endDate = $('#rc-end',m).value || null;
            if (!(amount>0)) return toast('Podaj kwotę większą od zera','err');
            if (!categoryId) return toast('Wybierz kategorię','err');
            if (!startDate) return toast('Podaj datę płatności','err');
            if (endDate && endDate < startDate) return toast('Data końca jest wcześniejsza niż płatność','err');
            const body = {amount, description:$('#rc-desc',m).value.trim(), frequency:$('#rc-freq',m).value, autoPost:$('#rc-auto',m).checked, accountId:+$('#rc-acc',m).value, categoryId, subcategoryId};
            if (!ed && startDate < todayIso() && body.autoPost && !await confirmBox({title:'Zaksięgować zaległe płatności?', text:`Pierwsza płatność jest w przeszłości (${fmtDate(startDate)}). Przy automatycznym księgowaniu aplikacja doda od razu wszystkie zaległe wystąpienia (maks. 24).`, okText:'Tak, dodaj', danger:false})) return;
            try {
                if (ed) await api('PATCH','/api/recurring/'+ed.id, {...body, nextDate:startDate, endDate, clearEndDate:!endDate, clearSubcategory:!subcategoryId});
                else await api('POST','/api/recurring', {...body, type, startDate, endDate});
                toast(ed?'Zapisano zmiany':'Płatność cykliczna dodana'); closeModal();
                if (S.view==='recurring') viewRecurring(); else rerender();
            } catch(err){ toast(err.message,'err'); }
        });
    }
    function recurringFromTx(txId){
        const t = txRows.find(x=>x.id===txId) || (S.allTx||[]).find(x=>x.id===txId); if (!t) return;
        const d = parseDate(t.transactionDate), n = new Date(d.getFullYear(), d.getMonth()+1, 1);
        n.setDate(Math.min(d.getDate(), new Date(n.getFullYear(), n.getMonth()+1, 0).getDate()));
        recurringModal(null, {type:t.type, amount:t.amount, description:t.description||t.subcategoryName, accountId:t.accountId, categoryId:t.categoryId, subcategoryId:t.subcategoryId, frequency:'MONTHLY', startDate:isoLocal(n)});
    }
    async function afterRecurringChange(){ await refreshAccounts(); S.allTx=null; refreshBudgetAlerts(); if (S.view==='recurring') viewRecurring(); else rerender(); }
    function postRecurring(id){
        const r = S.recurring.find(x=>x.id===id); if (!r) return;
        const m = openModal({title:`Zaksięguj „${esc(r.description||r.subcategoryName||r.categoryName)}”`, body:`
    <p class="muted" style="margin-bottom:14px">Transakcja zostanie dodana na konto <b>${esc(r.accountName)}</b>, a termin przesunie się na kolejny okres.</p>
    <div class="field amount-input"><input class="input num" id="pr-amt" type="number" step="0.01" min="0.01" value="${num(r.amount)}"><span>${esc(r.currency||'')}</span></div>
    <div class="field"><label>Data transakcji</label><input class="input" type="date" id="pr-date" value="${r.nextDate}"></div>`,
            footer:`<button class="btn btn-ghost" data-close>Anuluj</button><button class="btn btn-primary" id="pr-go">${icon('check')}Zaksięguj</button>`});
        $('#pr-go',m).onclick = e=>withBtn(e.currentTarget, async ()=>{
            const amount = num($('#pr-amt',m).value); if (!(amount>0)) return toast('Podaj kwotę większą od zera','err');

                if (r.type==='EXPENSE') checkBudgetAfterExpense(r.categoryId, $('#pr-date',m).value||r.nextDate);
                afterRecurringChange(); } catch(err){ toast(err.message,'err'); }
        });
    }
    async function skipRecurring(id){
        const r = S.recurring.find(x=>x.id===id);
        if (!await confirmBox({title:'Pominąć tę płatność?', text:`Termin ${r?fmtDate(r.nextDate):''} zostanie pominięty bez tworzenia transakcji.`, okText:'Pomiń', danger:false})) return;
        try { await api('POST',`/api/recurring/${id}/skip`); toast('Pominięto'); afterRecurringChange(); } catch(err){ toast(err.message,'err'); }
    }
    async function toggleRecurring(id, active){
        try { await api('PATCH','/api/recurring/'+id,{active}); toast(active?'Płatność wznowiona':'Płatność wstrzymana'); viewRecurring(); } catch(err){ toast(err.message,'err'); }
    }
    async function deleteRecurring(id){
        if (!await confirmBox({title:'Usunąć płatność cykliczną?', text:'Zaksięgowane już transakcje zostaną. Usunięty zostanie tylko harmonogram.'})) return;
        try { await api('DELETE','/api/recurring/'+id); toast('Płatność usunięta'); if (S.view==='recurring') viewRecurring(); else rerender(); } catch(err){ toast(err.message,'err'); }
    }

    /* =========================================================
       GOALS
       ========================================================= */
    function ringSvg(pct, color, size=84, stroke=8){
        const r = (size-stroke)/2, cfm = 2*Math.PI*r, p = Math.max(0, Math.min(100, pct));
        return `<svg viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${stroke}"/>
    ${p>0?`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${cfm*p/100} ${cfm}"/>`:''}</svg>`;
    }
    function goalCard(g){
        const col = /^#[0-9a-f]{6}$/i.test(g.color||'') ? g.color : cssVar('--green'), pct = num(g.percent);
        const due = g.targetDate ? (g.monthsLeft===0 && !g.completed ? `<span class="chip r">termin w tym miesiącu</span>` : `<span class="chip n">${icon('calendar')} do ${fmtDate(g.targetDate)}</span>`) : '';
        const linked = g.accountId ? `<span class="chip b">${icon('wallet')} ${esc(g.accountName)}</span>` : '';
        return `<div class="card goal-card">
    <div class="goal-top"><div class="ring">${ringSvg(pct, col)}<b class="num">${Math.round(Math.min(pct,999))}%</b></div>
      <div style="min-width:0;flex:1"><div style="font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(g.name)}</div>
        <div class="num" style="margin-top:4px"><b style="font-size:18px">${fmtMoney(g.currentAmount,g.currency)}</b> <span class="faint">z ${fmtMoney(g.targetAmount,g.currency)}</span></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${g.completed?`<span class="chip g">${icon('check')} osiągnięty</span>`:''}${due}${linked}</div></div></div>
    <div class="note" style="margin:0">${g.completed ? 'Gratulacje, cel jest osiągnięty.' : g.monthlyNeeded!=null ? `Odkładaj <b class="num">${fmtMoney(g.monthlyNeeded,g.currency)}</b> miesięcznie, aby zdążyć. Brakuje ${fmtMoney(g.remaining,g.currency)}.` : `Brakuje <b class="num">${fmtMoney(g.remaining,g.currency)}</b>. Ustaw termin, a policzę miesięczną kwotę.`}</div>
    <div class="acts">${g.accountId?`<button class="btn btn-ghost btn-sm" onclick="transferModal()">${icon('swap')}Przelew na konto</button>`:`<button class="btn btn-primary btn-sm" onclick="contributeModal(${g.id},1)">${icon('plus')}Wpłać</button><button class="btn btn-ghost btn-sm" onclick="contributeModal(${g.id},-1)">Wypłać</button>`}
      <span style="flex:1"></span><button class="icon-btn" title="Edytuj" onclick="goalModal(${g.id})">${icon('edit')}</button><button class="icon-btn danger" title="Usuń" onclick="deleteGoal(${g.id})">${icon('trash')}</button></div>
  </div>`;
    }
    async function viewGoals(){
        setHeader('Cele oszczędnościowe', 'Odkładaj na to, co ważne', `${currencySelect()}<button class="btn btn-primary" id="g-addgoal">${icon('plus')}Nowy cel</button>`);
        bindCurrencySelect(); $('#g-addgoal').onclick = ()=>goalModal();
        const c = $('#content'); c.innerHTML = skeleton(3);
        try { S.goals = await api('GET','/api/goals') || []; } catch(err){ c.innerHTML = `<div class="card">${emptyState('flag','Nie udało się wczytać celów', esc(err.message))}</div>`; return; }
        if (S.view!=='goals') return;
        const gs = S.goals.filter(g=>g.currency===S.currency);
        const saved = gs.reduce((s,g)=>s+Math.min(num(g.currentAmount),num(g.targetAmount)),0), target = gs.reduce((s,g)=>s+num(g.targetAmount),0);
        const monthly = gs.reduce((s,g)=>s+num(g.monthlyNeeded),0);
        if (!S.goals.length){ c.innerHTML = `<div class="card">${emptyState('flag','Nie masz jeszcze celów','Wakacje, poduszka finansowa, nowy samochód: ustaw kwotę i termin, a śledź postęp tutaj.',`<button class="btn btn-primary" onclick="goalModal()">${icon('plus')}Dodaj pierwszy cel</button>`)}</div>`; return; }
        c.innerHTML = `
    <div class="grid g-4 mb">
      <div class="card kpi"><div class="lbl"><span class="ico g">${icon('piggy')}</span>Odłożone na cele</div><div class="val num">${fmtMoney(saved)}</div><div class="delta">z ${fmtMoney(target)}</div></div>
      <div class="card kpi"><div class="lbl"><span class="ico o">${icon('target')}</span>Postęp łączny</div><div class="val num">${target?Math.round(saved/target*100):0}%</div><div class="bar" style="margin-top:10px"><span style="width:${target?Math.min(100,saved/target*100):0}%;background:var(--green)"></span></div></div>

      <div class="card kpi"><div class="lbl"><span class="ico v">${icon('check')}</span>Osiągnięte</div><div class="val num">${S.goals.filter(g=>g.completed).length} / ${S.goals.length}</div><div class="delta">celów</div></div>
    </div>
    <div class="grid g-3">${[...S.goals].sort((a,b)=>a.completed-b.completed || (a.targetDate||'9999').localeCompare(b.targetDate||'9999')).map(goalCard).join('')}</div>`;
    }

        const cs = currencies().length ? currencies() : ['PLN'];
        const m = openModal({title: ed?'Edytuj cel':'Nowy cel oszczędnościowy', body:`
    <div class="field"><label>Nazwa celu</label><input class="input" id="go-name" maxlength="100" placeholder="np. Wakacje w Japonii" value="${esc(ed?.name||'')}"></div>
    <div class="row"><div class="field"><label>Kwota docelowa</label><input class="input num" type="number" min="1" step="1" id="go-target" value="${ed?num(ed.targetAmount):''}" placeholder="0"></div>
      <div class="field"><label>Termin (opcjonalnie)</label><input class="input" type="date" id="go-date" value="${ed?.targetDate||''}"></div></div>
    <div class="field"><label>Postęp liczę na podstawie</label><div class="seg" id="go-src"><button data-k="manual">Ręcznych wpłat</button><button data-k="acc">Salda konta</button></div></div>
    <div id="go-manual"><div class="row">${ed?'':`<div class="field"><label>Już odłożone</label><input class="input num" type="number" min="0" step="0.01" id="go-init" placeholder="0"></div>`}
      <div class="field"><label>Waluta</label><select class="input" id="go-cur" ${ed&&!ed.accountId?'disabled':''}>${cs.map(c=>`<option ${c===(ed?.currency||S.currency)?'selected':''}>${c}</option>`).join('')}</select></div></div></div>
    <div id="go-acc" class="field"><label>Konto</label><select class="input" id="go-account">${spendAccs().map(a=>`<option value="${a.id}" ${a.id===ed?.accountId?'selected':''}>${esc(a.name)} · ${fmtMoney(a.balance,a.currency)}</option>`).join('')}</select><span class="hint">Postęp = aktualne saldo konta, np. konta oszczędnościowego przeznaczonego na ten cel.</span></div>
    <div class="field"><label>Kolor</label><div class="colors" id="go-colors">${CAT_SWATCHES.map(s=>`<button type="button" data-c="${s}" style="background:${s}"></button>`).join('')}</div></div>`,
            footer:`<button class="btn btn-ghost" data-close>Anuluj</button><button class="btn btn-primary" id="go-save">${ed?'Zapisz':'Utwórz cel'}</button>`});
        const upd = ()=>{ $$('#go-src button',m).forEach(b=>b.classList.toggle('on',b.dataset.k===src)); $('#go-manual',m).classList.toggle('hidden',src!=='manual'); $('#go-acc',m).classList.toggle('hidden',src!=='acc');
            $$('#go-colors button',m).forEach(b=>b.classList.toggle('on',b.dataset.c.toUpperCase()===color.toUpperCase())); };
        $$('#go-src button',m).forEach(b=>b.onclick=()=>{ if (b.dataset.k==='acc' && !S.accounts.length) return toast('Nie masz kont','err'); src=b.dataset.k; upd(); });
        $$('#go-colors button',m).forEach(b=>b.onclick=()=>{ color=b.dataset.c; upd(); }); upd();
        $('#go-save',m).onclick = e=>withBtn(e.currentTarget, async ()=>{
            const name = $('#go-name',m).value.trim(), targetAmount = num($('#go-target',m).value), targetDate = $('#go-date',m).value||null;
            if (!name) return toast('Podaj nazwę celu','err'); if (!(targetAmount>0)) return toast('Podaj kwotę docelową','err');
            try {
                if (ed) await api('PATCH','/api/goals/'+ed.id,{name, targetAmount, targetDate, clearTargetDate:!targetDate, color, ...(src==='acc'?{accountId:+$('#go-account',m).value}:{clearAccount:!!ed.accountId})});
                else await api('POST','/api/goals',{name, targetAmount, targetDate, color, ...(src==='acc'?{accountId:+$('#go-account',m).value}:{currency:$('#go-cur',m).value, initialAmount:num($('#go-init',m).value)})});
                toast(ed?'Cel zaktualizowany':'Cel utworzony'); closeModal(); if (S.view==='goals') viewGoals(); else rerender();
            } catch(err){ toast(err.message,'err'); }
        });
    }
    function contributeModal(id, sign){
        const g = S.goals.find(x=>x.id===id); if (!g) return;
        const m = openModal({title: sign>0?`Wpłata na „${esc(g.name)}”`:`Wypłata z „${esc(g.name)}”`, body:`
    <div class="field amount-input"><input class="input num" id="gc-amt" type="number" step="0.01" min="0.01" placeholder="0,00" ${sign<0?`max="${num(g.savedAmount)}"`:''}><span>${esc(g.currency)}</span></div>
    <p class="hint">${sign>0?`Do celu brakuje ${fmtMoney(g.remaining,g.currency)}.`:`Odłożone: ${fmtMoney(g.savedAmount,g.currency)}.`} To zapis postępu celu, saldo kont się nie zmienia.</p>`,
            footer:`<button class="btn btn-ghost" data-close>Anuluj</button><button class="btn btn-primary" id="gc-go">${sign>0?'Wpłać':'Wypłać'}</button>`});

    async function deleteGoal(id){
        const g = S.goals.find(x=>x.id===id);
        if (!await confirmBox({title:`Usunąć cel „${g?.name||''}”?`, text:'Konta i transakcje pozostaną bez zmian.'})) return;
        try { await api('DELETE','/api/goals/'+id); toast('Cel usunięty'); viewGoals(); } catch(err){ toast(err.message,'err'); }
    }

    /* =========================================================
   LOANS (kredyty)
   ========================================================= */
    const INST_N = {DECREASING:'Malejące', ANNUITY:'Równe'};
    const STRAT_N = {SHORTEN_TERM:'Skrócenie okresu', REDUCE_INSTALLMENT:'Niższa rata'};
    async function viewLoans(){
        setHeader('Kredyty', 'Zadłużenie, postęp spłaty i najbliższe raty', `<button class="btn btn-primary" id="l-add">${icon('plus')}Nowy kredyt</button>`);
        $('#l-add').onclick = ()=>loanModal();
        const c = $('#content'); c.innerHTML = skeleton(3);
        try { S.loans = await api('GET','/api/loans') || []; } catch(err){ toast(err.message,'err'); S.loans = S.loans || []; }
        if (S.view!=='loans') return;
        const loans = S.loans;
        if (!loans.length){
            c.innerHTML = `<div class="card">${emptyState('scale','Nie masz jeszcze kredytów','Dodaj kredyt, aby widzieć dług w wartości netto i śledzić postęp spłaty.',`<button class="btn btn-primary" onclick="loanModal()">${icon('plus')}Dodaj kredyt</button>`)}</div>`;
            return;
        }
        const byCur = {};
        loans.forEach(l=>{ const e = byCur[l.currency] = byCur[l.currency] || {out:0, rep:0}; e.out += num(l.outstandingPrincipal); e.rep += num(l.repaidPrincipal); });
        const sumTxt = k => Object.entries(byCur).map(([cu,e])=>fmtMoney(e[k],cu)).join(' · ');
        const next = loans.filter(l=>l.nextPaymentDate).sort((a,b)=>String(a.nextPaymentDate).localeCompare(String(b.nextPaymentDate)))[0];
        const n = loans.length;
        c.innerHTML = `<div class="grid g-3 mb">
      <div class="card kpi"><div class="lbl"><span class="ico r">${icon('scale')}</span>Pozostało do spłaty</div><div class="val num">${sumTxt('out')}</div><div class="delta">${n} ${n===1?'kredyt':(n<5?'kredyty':'kredytów')}</div></div>
      <div class="card kpi"><div class="lbl"><span class="ico g">${icon('check')}</span>Spłacony kapitał</div><div class="val num pos">${sumTxt('rep')}</div><div class="delta">od uruchomienia kredytów</div></div>
                  <div class="card kpi"><div class="lbl"><span class="ico a">${icon('calendar')}</span>Najbliższa rata</div><div class="val">${next?fmtDate(next.nextPaymentDate):'—'}</div><div class="delta">${next?esc(next.name):'brak'}</div></div>
    </div>
    ${loans.map(loanCard).join('')}
    <div class="note">Rata dzieli się na spłatę kapitału (przelew na kredyt) i odsetki (wydatek w kategorii „Kredyty i pożyczki”). Dopłata państwa nie schodzi z konta i nie jest wydatkiem. Spłacony kredyt (saldo 0) zarchiwizujesz w zakładce Konta. Kredyt na mieszkanie? Dodaj w zakładce Konta konto typu „Nieruchomości” z wartością mieszkania i datą zakupu, a wartość netto pokaże mieszkanie minus dług zamiast samego długu. Dług widać w historii od daty uruchomienia kredytu: do dnia „Stan na dzień” aplikacja szacuje go z harmonogramu, potem liczy z zapisanych spłat.</div>`;
    }
    function loanCard(l){
        const p = Math.min(num(l.percentRepaid), 100);
        const info = [
            ['Oprocentowanie', `${num(l.annualInterestRate).toLocaleString('pl-PL',{maximumFractionDigits:4})}% · ${l.rateType==='VARIABLE'?'zmienne':'stałe'}`],
            ['Raty', (INST_N[l.installmentType]||l.installmentType).toLowerCase() + `, ${l.paymentDay}. dnia miesiąca`],
            ['Najbliższa rata', l.nextPaymentDate ? fmtDate(l.nextPaymentDate) : 'kredyt spłacony'],
            ['Koniec według umowy', fmtDate(l.plannedEndDate)],
            ['Po nadpłacie domyślnie', (STRAT_N[l.overpaymentStrategy]||l.overpaymentStrategy).toLowerCase()],
            ['Konto spłaty', l.defaultPaymentAccountName ? esc(l.defaultPaymentAccountName) : '—'],
        ];
        if (l.subsidizedRate!=null) info.splice(1, 0, ['Po dopłacie płacisz', `${pct(l.subsidizedRate)}%${l.subsidyEndDate?' do '+fmtDate(l.subsidyEndDate):''}`]);
        const stats = num(l.paymentsCount) ? [
            ['Spłacony kapitał z rat', fmtMoney(l.installmentPrincipalPaid,l.currency)],
            ['Nadpłacono', fmtMoney(l.overpaidPrincipal,l.currency)],
            ['Odsetki zapłacone przez Ciebie', fmtMoney(l.interestPaid,l.currency)],
            ...(num(l.subsidyReceived) ? [['Dopłata państwa', fmtMoney(l.subsidyReceived,l.currency)]] : []),
            ...(num(l.feesPaid) ? [['Opłaty', fmtMoney(l.feesPaid,l.currency)]] : []),
            ['Ostatnia spłata', fmtDate(l.lastPaymentDate)],
        ] : [];
        const paidOff = num(l.outstandingPrincipal)===0;
        return `<div class="card mb"><div class="card-h"><h3>${esc(l.name)}</h3><span class="faint">${esc([l.lender, l.groupName].filter(Boolean).join(' · '))}</span></div>
    <div class="card-b">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px">
        <div><span class="faint">Pozostało</span> <b class="num" style="font-size:20px">${fmtMoney(l.outstandingPrincipal,l.currency)}</b> <span class="faint">z ${fmtMoney(l.originalPrincipal,l.currency)}</span></div>
        <span class="chip g">spłacono ${num(l.percentRepaid).toLocaleString('pl-PL')}%</span>
      </div>
            </div>
      <div class="pbar"><span style="width:${p}%;background:var(--green)"></span></div>
      <div class="legend" style="margin-top:16px">${info.map(([k,v])=>`<div class="legend-i"><span class="n muted">${k}</span><b>${v}</b></div>`).join('')}</div>
      ${stats.length?`<div class="legend" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">${stats.map(([k,v])=>`<div class="legend-i"><span class="n muted">${k}</span><b class="num">${v}</b></div>`).join('')}</div>`:''}
      <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
        ${paidOff?'':`<button class="btn btn-primary btn-sm" onclick="loanPaymentModal(${l.id},'INSTALLMENT')">${icon('cash')}Zapłać ratę</button>
        <button class="btn btn-ghost btn-sm" onclick="loanPaymentModal(${l.id},'OVERPAYMENT')">${icon('down')}Nadpłać</button>`}
        <button class="btn btn-ghost btn-sm" onclick="loanPaymentsModal(${l.id})">${icon('list')}Spłaty${num(l.paymentsCount)?` (${l.paymentsCount})`:''}</button>
        <button class="btn btn-ghost btn-sm" onclick="accountHistoryModal(${l.accountId})">${icon('history')}Historia salda</button>
        <button class="btn btn-ghost btn-sm" onclick="loanModal(${l.id})">${icon('edit')}Ustawienia</button>
      </div>
    </div></div>`;
    }
    function loanModal(id){
        const ed = id ? (S.loans||[]).find(l=>l.id===id) : null;
        const groups = S.user?.groups||[];
        if (!ed && !groups.length){ toast('Najpierw utwórz grupę','err'); return groupModal(); }
        const seg = (sid, map, val) => `<div class="seg" id="${sid}">${Object.entries(map).map(([k,n])=>`<button type="button" data-k="${k}" class="${k===val?'on':''}">${n}</button>`).join('')}</div>`;
        const payOpts = sel => `<option value="">— nie wybrano —</option>` + spendAccs().map(a=>`<option value="${a.id}" ${String(sel)===String(a.id)?'selected':''}>${esc(a.name)} · ${esc((a.currency||'').toUpperCase())}</option>`).join('');
        const m = openModal({title: ed?'Ustawienia kredytu':'Nowy kredyt', wide:true, body:`
    <div class="row">
      <div class="field"><label>Nazwa</label><input class="input" id="ln-name" maxlength="100" value="${esc(ed?.name||'')}" placeholder="np. Hipoteka"></div>
      <div class="field"><label>Bank</label><input class="input" id="ln-lender" maxlength="100" value="${esc(ed?.lender||'')}" placeholder="opcjonalnie"></div>
    </div>
    ${ed?'':`<div class="row">
      <div class="field"><label>Kwota kredytu z umowy</label><input class="input num" type="number" min="0.01" step="0.01" id="ln-orig" placeholder="0,00"></div>
      <div class="field"><label>Data uruchomienia</label><input class="input" type="date" id="ln-start" max="${isoLocal()}"></div>
    </div>
    <div class="row">
      <div class="field"><label>Pozostało do spłaty (kapitał)</label><input class="input num" type="number" min="0.01" step="0.01" id="ln-out" placeholder="0,00"><span class="hint">Z wyciągu albo z aplikacji banku.</span></div>
            <div class="field"><label>Stan na dzień</label><input class="input" type="date" id="ln-bdate" value="${isoLocal()}" max="${isoLocal()}"><span class="hint">Wcześniej dług w wykresach jest szacowany z harmonogramu od daty uruchomienia.</span></div>
    </div>
    <div class="row">
      <div class="field"><label>Waluta</label><input class="input" id="ln-cur" value="PLN" maxlength="3" style="text-transform:uppercase"></div>
      <div class="field"><label>Grupa</label><select class="input" id="ln-group">${groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>Rodzaj rat</label>${seg('ln-inst', INST_N, 'DECREASING')}</div>`}
    <div class="row">
      <div class="field"><label>Okres kredytu (miesiące)</label><input class="input num" type="number" min="1" max="600" step="1" id="ln-term" value="${ed?ed.termMonths:''}" placeholder="np. 360"></div>
      <div class="field"><label>Oprocentowanie roczne (%)</label><input class="input num" type="number" min="0" max="100" step="0.0001" id="ln-rate" value="${ed?num(ed.annualInterestRate):''}" placeholder="np. 7,2"></div>
    </div>
    <div class="row">
      <div class="field"><label>Dzień płatności raty</label><input class="input num" type="number" min="1" max="31" step="1" id="ln-day" value="${ed?ed.paymentDay:''}" placeholder="1–31"></div>
            <div class="field"><label>Konto spłaty</label><select class="input" id="ln-pay">${payOpts(ed?.defaultPaymentAccountId)}</select></div>
    </div>
    <div class="field"><label>Oprocentowanie</label>${seg('ln-rtype', {FIXED:'Stałe', VARIABLE:'Zmienne'}, ed?.rateType||'FIXED')}</div>
    <div class="field"><label>Po nadpłacie domyślnie</label>${seg('ln-strat', STRAT_N, ed?.overpaymentStrategy||'SHORTEN_TERM')}<span class="hint">Przy każdej nadpłacie wybierzesz to jeszcze raz.</span></div>
    <label class="check" style="display:flex;gap:8px;align-items:center;margin:4px 0 10px"><input type="checkbox" id="ln-sub" ${ed?.subsidizedRate!=null?'checked':''}> Kredyt z dopłatą do rat (np. Bezpieczny Kredyt 2%)</label>
    <div class="row" id="ln-sub-box" style="${ed?.subsidizedRate!=null?'':'display:none'}">
      <div class="field"><label>Oprocentowanie po dopłacie (%)</label><input class="input num" type="number" min="0" max="100" step="0.0001" id="ln-srate" value="${ed?.subsidizedRate!=null?num(ed.subsidizedRate):''}" placeholder="np. 4,14"><span class="hint">Tyle płacisz Ty; resztę odsetek pokrywa państwo.</span></div>
      <div class="field"><label>Dopłata do dnia</label><input class="input" type="date" id="ln-send" value="${ed?.subsidyEndDate||''}"><span class="hint">W BK2% dopłaty trwają 10 lat od uruchomienia.</span></div>
    </div>`,
            footer:`<button class="btn btn-ghost" data-close>Anuluj</button><button class="btn btn-primary" id="ln-save">${ed?'Zapisz zmiany':'Dodaj kredyt'}</button>`});
        $$('.seg', m).forEach(s=>$$('button', s).forEach(b=>b.onclick=()=>$$('button', s).forEach(x=>x.classList.toggle('on', x===b))));
        const segVal = sid => $(`#${sid} button.on`, m)?.dataset.k;
        const val = sid => $('#'+sid, m).value.trim().replace(',', '.');
        const tenYears = () => { const st = ed?.startDate || val('ln-start'); if (!st) return ''; const d = parseDate(st); return isoLocal(new Date(d.getFullYear()+10, d.getMonth(), d.getDate())); };
        $('#ln-sub',m).onchange = e=>{ $('#ln-sub-box',m).style.display = e.target.checked?'':'none'; if (e.target.checked && !$('#ln-send',m).value) $('#ln-send',m).value = tenYears(); };
        $('#ln-save',m).onclick = e=>withBtn(e.currentTarget, async ()=>{
            const name = val('ln-name'); if (!name) return toast('Podaj nazwę kredytu','err');
            const termMonths = parseInt(val('ln-term'),10), rate = val('ln-rate'), paymentDay = parseInt(val('ln-day'),10);
            if (!(termMonths>=1 && termMonths<=600)) return toast('Okres kredytu to od 1 do 600 miesięcy','err');
            if (rate==='' || !(num(rate)>=0 && num(rate)<=100)) return toast('Podaj oprocentowanie w procentach, np. 7,2','err');
            if (!(paymentDay>=1 && paymentDay<=31)) return toast('Dzień płatności to liczba od 1 do 31','err');
            const pay = $('#ln-pay',m).value;
            const hasSub = $('#ln-sub',m).checked, srate = val('ln-srate');
            if (hasSub && (srate==='' || !(num(srate)>=0 && num(srate)<=num(rate)))) return toast('Oprocentowanie po dopłacie musi być niższe niż oprocentowanie kredytu','err');
            const subsidy = hasSub ? {subsidizedRate:+(+srate).toFixed(4), subsidyEndDate:val('ln-send')||undefined} : {};
            const common = {name, lender:val('ln-lender'), termMonths, annualInterestRate:+(+rate).toFixed(4), rateType:segVal('ln-rtype'), paymentDay, overpaymentStrategy:segVal('ln-strat'), ...subsidy};
            try {
                if (ed) {
                    await api('PATCH','/api/loans/'+ed.id, {...common, ...(pay ? {defaultPaymentAccountId:+pay} : {clearDefaultPaymentAccount:true}), ...(hasSub ? {} : {clearSubsidy:true})});
                } else {
                    const orig = num(val('ln-orig')), out = num(val('ln-out')), currency = val('ln-cur').toUpperCase() || 'PLN';
                    if (!(orig>0)) return toast('Podaj kwotę kredytu z umowy','err');
                    if (!(out>0)) return toast('Podaj, ile kapitału zostało do spłaty','err');
                    if (!val('ln-start')) return toast('Podaj datę uruchomienia kredytu','err');
                    if (!/^[A-Z]{3}$/.test(currency)) return toast('Waluta to trzyliterowy kod, np. PLN','err');
                    await api('POST','/api/loans', {...common, lender:common.lender||undefined, currency, groupId:+$('#ln-group',m).value,
                        originalPrincipal:+orig.toFixed(2), outstandingPrincipal:+out.toFixed(2), startDate:val('ln-start'),
                        balanceDate:val('ln-bdate')||isoLocal(), installmentType:segVal('ln-inst'), defaultPaymentAccountId:pay?+pay:undefined});
                }
                toast(ed?'Kredyt zaktualizowany':'Kredyt dodany'); closeModal(); S.loans = null; await refreshAccounts();
                if (S.view==='loans') viewLoans(); else rerender();
            } catch(err){ toast(err.message,'err'); }
        });
    }

    const PAY_N = {INSTALLMENT:'Rata', OVERPAYMENT:'Nadpłata', DISBURSEMENT:'Wypłata transzy'};
    function pct(v){ return num(v).toLocaleString('pl-PL',{maximumFractionDigits:4}); }
    async function reloadLoans(){ S.loans = await api('GET','/api/loans') || []; await refreshAccounts(); }

    /* Rata, nadpłata albo wypłata. Kwoty wypełnia podpowiedź z serwera; wpisujesz je z wyciągu. */
    async function loanPaymentModal(loanId, kind='INSTALLMENT', paymentId=null){
        if (!S.loans) { try { S.loans = await api('GET','/api/loans') || []; } catch(err){ return toast(err.message,'err'); } }
        const l = S.loans.find(x=>x.id===loanId); if (!l) return;
        let ed = null;
        if (paymentId){ try { ed = (await api('GET',`/api/loans/${loanId}/payments`)||[]).find(p=>p.id===paymentId); } catch(err){ return toast(err.message,'err'); } if (!ed) return; kind = ed.kind; }
        const accs = spendAccs().filter(a=>(a.currency||'').toUpperCase()===(l.currency||'').toUpperCase());
        if (!accs.length) return toast(`Brak konta w ${l.currency}, z którego można spłacić kredyt`,'err');
        const payer = ed?.payerAccountId ?? l.defaultPaymentAccountId ?? accs[0].id;
        const money = (id, label, hint='') => `<div class="field"><label>${label}</label><input class="input num" type="number" min="0" step="0.01" id="${id}" placeholder="0,00">${hint?`<span class="hint" id="${id}-h">${hint}</span>`:''}</div>`;
        const m = openModal({title: `${ed?'Edycja · ':''}${esc(l.name)}`, wide:true, body:`
    <div class="field"><div class="seg" id="lp-kind">${Object.entries(PAY_N).map(([k,n])=>`<button type="button" data-k="${k}" class="${k===kind?'on':''}" ${ed&&k!==kind?'disabled':''}>${n}</button>`).join('')}</div></div>
    <div class="row">
      <div class="field"><label>Data pobrania</label><input class="input" type="date" id="lp-date"></div>
      <div class="field"><label id="lp-acc-l">Z konta</label><select class="input" id="lp-acc">${accs.map(a=>`<option value="${a.id}" ${String(a.id)===String(payer)?'selected':''}>${esc(a.name)} · ${fmtMoney(a.balance,a.currency)}</option>`).join('')}</select></div>
    </div>
    <div class="row">${money('lp-princ','Kapitał')}${money('lp-int','Odsetki naliczone przez bank','&nbsp;')}</div>
    <div class="row" id="lp-row2">${money('lp-sub','Dopłata państwa','Część odsetek, której nie płacisz.')}${money('lp-fee','Opłaty i prowizje')}</div>
    <div class="row" id="lp-row3">
      <div class="field"><label>Zeszło z konta (z wyciągu)</label><input class="input num" type="number" min="0" step="0.01" id="lp-paid" placeholder="0,00"><span class="hint">Wpisz kwotę z wyciągu, a dopłata przeliczy się sama.</span></div>
      <div class="field" id="lp-strat-f"><label>Po nadpłacie</label>${`<div class="seg" id="lp-strat">${Object.entries(STRAT_N).map(([k,n])=>`<button type="button" data-k="${k}">${n}</button>`).join('')}</div>`}</div>
    </div>
    <div class="field"><label>Opis</label><input class="input" id="lp-desc" maxlength="255" placeholder="opcjonalnie, np. Rata 12/2026"></div>
    <div class="note" id="lp-sum" style="margin-top:4px"></div>`,
            footer:`<button class="btn btn-ghost" data-close>Anuluj</button><button class="btn btn-primary" id="lp-save">${ed?'Zapisz zmiany':'Zapisz'}</button>`});
        const f = id => $('#'+id, m), v = id => num(f(id).value.replace(',','.'));
        const setMoney = (id, x) => f(id).value = x==null ? '' : num(x).toFixed(2);
        const curKind = () => $('#lp-kind button.on', m).dataset.k;
        const setStrat = k => $$('#lp-strat button', m).forEach(b=>b.classList.toggle('on', b.dataset.k===k));
        $$('#lp-strat button', m).forEach(b=>b.onclick=()=>setStrat(b.dataset.k));
        setStrat(ed?.strategy || l.overpaymentStrategy);
        const layout = () => {
            const k = curKind(), disb = k==='DISBURSEMENT';
            f('lp-acc-l').textContent = disb ? 'Na konto' : 'Z konta';
            $$('#lp-int, #lp-sub, #lp-paid', m).forEach(x=>x.closest('.field').style.display = disb?'none':'');
            f('lp-sub').closest('.field').style.display = disb ? 'none' : '';
            f('lp-strat-f').style.display = k==='OVERPAYMENT' ? '' : 'none';
        };
        const summary = () => {
            const k = curKind(), p = v('lp-princ'), i = v('lp-int'), s = Math.min(v('lp-sub'), i), fee = v('lp-fee'), cu = l.currency;
            if (k==='DISBURSEMENT'){ f('lp-sum').innerHTML = `Na konto: <b>${fmtMoney(p-fee,cu)}</b> · dług rośnie o <b>${fmtMoney(p,cu)}</b>${fee?` · wydatek (prowizja): <b>${fmtMoney(fee,cu)}</b>`:''}`; return; }
            const paid = p + i - s + fee;
            f('lp-sum').innerHTML = `Z konta: <b>${fmtMoney(paid,cu)}</b> · wydatek (odsetki${fee?' i opłaty':''}): <b>${fmtMoney(i-s+fee,cu)}</b> · spłata kapitału: <b>${fmtMoney(p,cu)}</b>${s?` · dopłata: <b>${fmtMoney(s,cu)}</b>`:''}`;
            if (document.activeElement!==f('lp-paid')) setMoney('lp-paid', paid);
        };
        // Kwota z wyciągu → dopłata = kapitał + odsetki + opłaty − to, co zeszło z konta.
        f('lp-paid').oninput = () => { const s = v('lp-princ') + v('lp-int') + v('lp-fee') - v('lp-paid'); setMoney('lp-sub', Math.max(0, Math.round(s*100)/100)); summary(); };
        $$('#lp-princ, #lp-int, #lp-sub, #lp-fee', m).forEach(x=>x.oninput = summary);
        const suggest = async () => {
            try {
                const k = curKind(), d = f('lp-date').value;
                const sg = await api('GET', `/api/loans/${loanId}/payments/suggest` + qs({kind:k, date:d||undefined}));
                if (!d) f('lp-date').value = sg.paymentDate;
                setMoney('lp-princ', k==='OVERPAYMENT' && v('lp-princ') ? v('lp-princ') : sg.principalAmount);
                setMoney('lp-int', sg.interestAmount); setMoney('lp-sub', sg.subsidyAmount); setMoney('lp-fee', sg.feeAmount);
                f('lp-int-h').textContent = k==='DISBURSEMENT' ? '' : `Szacunek: ${sg.interestDays} dni od ${fmtShort(sg.interestFrom)} od kapitału ${fmtMoney(sg.outstandingBefore,l.currency)}. Popraw na kwotę z wyciągu.`;
                if (k==='OVERPAYMENT' && !v('lp-princ')) f('lp-princ').focus();
                summary();
            } catch(err){ toast(err.message,'err'); }
        };
        $$('#lp-kind button', m).forEach(b=>b.onclick=()=>{ if (ed) return; $$('#lp-kind button', m).forEach(x=>x.classList.toggle('on', x===b)); f('lp-princ').value=''; layout(); suggest(); });
        f('lp-date').onchange = () => { if (!ed) suggest(); };
        layout();
        if (ed){
            f('lp-date').value = ed.paymentDate; setMoney('lp-princ', ed.principalAmount); setMoney('lp-int', ed.interestAmount);
            setMoney('lp-sub', ed.subsidyAmount); setMoney('lp-fee', ed.feeAmount); f('lp-desc').value = ed.description||'';
            f('lp-int-h').innerHTML = `<a href="#" id="lp-sg">Podpowiedz kwoty na tę datę</a>`; $('#lp-sg',m).onclick = e=>{ e.preventDefault(); suggest(); };
            summary();
        } else {
            if (kind==='OVERPAYMENT') f('lp-date').value = isoLocal();
            await suggest();
        }
        $('#lp-save',m).onclick = e=>withBtn(e.currentTarget, async ()=>{
            const k = curKind(), date = f('lp-date').value;
            if (!date) return toast('Podaj datę pobrania','err');
            const body = {kind:k, paymentDate:date, payerAccountId:+f('lp-acc').value, principalAmount:+v('lp-princ').toFixed(2),
                interestAmount:k==='DISBURSEMENT'?0:+v('lp-int').toFixed(2), subsidyAmount:k==='DISBURSEMENT'?0:+v('lp-sub').toFixed(2),
                feeAmount:+v('lp-fee').toFixed(2), strategy:k==='OVERPAYMENT' ? $('#lp-strat button.on',m)?.dataset.k : undefined,
                description:f('lp-desc').value.trim()||undefined};
            if (body.subsidyAmount > body.interestAmount) return toast('Dopłata nie może być wyższa niż odsetki','err');
            if (k!=='INSTALLMENT' && !(body.principalAmount>0)) return toast('Podaj kwotę kapitału','err');
            try {
                if (ed) await api('PUT', `/api/loans/${loanId}/payments/${ed.id}`, body);
                else await api('POST', `/api/loans/${loanId}/payments`, body);
                toast(ed ? 'Spłata zaktualizowana' : (k==='DISBURSEMENT' ? 'Wypłata zapisana' : 'Spłata zapisana'));
                closeModal(); await reloadLoans();
                if (modalStack.length && $('#lps-body')) loanPaymentsModal(loanId, true);
                if (S.view==='loans') viewLoans(); else rerender();
            } catch(err){ toast(err.message,'err'); }
        });
    }

      ${rows.map(p=>`<tr><td>${fmtDate(p.paymentDate)} · <b>${PAY_N[p.kind]||p.kind}</b><span class="delta faint">${esc(p.payerAccountName||'')}${p.strategy?' · '+(STRAT_N[p.strategy]||'').toLowerCase():''}${p.description?' · '+esc(p.description):''}</span></td>
        <td class="num">${mny(p.principalAmount)}</td><td class="num">${mny(p.interestPaid)}</td>${hasSub?`<td class="num">${num(p.subsidyAmount)?mny(p.subsidyAmount):'—'}</td>`:''}
        ${hasFee?`<td class="num">${num(p.feeAmount)?mny(p.feeAmount):'—'}</td>`:''}<td class="num"><b>${p.kind==='DISBURSEMENT'?'+':''}${mny(p.payerAmount)}</b></td><td class="num">${mny(p.outstandingAfter)}</td>

      <p class="hint" style="margin-top:12px">Odsetki (Twoje) to odsetki po dopłacie, czyli wydatek. Usunięcie spłaty cofa przelew kapitału i wydatki.</p>`

      <div class="chart-box sm" style="height:200px;margin-bottom:12px"><canvas id="ah-c"></canvas></div>
      ${num(h.openingBalance)?`<div class="note">Saldo sprzed historii zapisanej w aplikacji: ${fmtMoney(h.openingBalance,cur)}. Uwzględniono je w saldzie narastającym.</div>`:''}
      ${rows.length?`<div class="hist-row h"><span class="c-date">Data</span><span>Operacja</span><span style="text-align:right">Kwota</span><span class="c-bal" style="text-align:right">Saldo po</span></div>
      ${rows.slice(0,shown).map(e=>{ const tr = e.kind!=='TRANSACTION', col = tr ? cssVar('--blue') : catColor(e.categoryName);

                    return `<div class="hist-row"><span class="c-date faint">${fmtDate(e.date)}</span>
          <div style="min-width:0;display:flex;gap:10px;align-items:center"><span class="dot" style="background:${col}"></span><div style="min-width:0"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(title)}</div><div class="faint" style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(sub)}${e.userName?' · '+esc(e.userName):''}</div></div></div>
          <span class="num ${num(e.amount)>=0?'pos':''}" style="text-align:right;font-weight:600">${num(e.amount)>=0?'+':'−'}${fmtMoney(Math.abs(num(e.amount)),cur)}</span>
          <span class="num c-bal" style="text-align:right;font-weight:600">${fmtMoney(e.balance,cur)}</span></div>`; }).join('')}
      ${rows.length>shown?`<div style="text-align:center;padding:12px"><button class="btn btn-ghost btn-sm" id="ah-more">Pokaż więcej (${rows.length-shown})</button></div>`:''}`
