        };
        draw();
    }

    /* =========================================================
       REPORTS: SANKEY, TRENDS, COMPARE, TOP
       ========================================================= */
    function sankeySvg(left, right, cur){
        const total = left.reduce((s,x)=>s+x.value,0);
        const W=960, nodeW=14, gap=18, padT=34, padB=8;
        const n = Math.max(left.length, right.length, 1);
        const H = Math.max(320, Math.min(720, n*52 + padT + padB));
        const k = (H - padT - padB - gap*(n-1)) / total;
        const xL=180, xM=W/2-nodeW/2, xR=W-200;
        const layout = list=>{ const h = list.reduce((s,x)=>s+x.value*k,0) + gap*(list.length-1); let y = padT + (H-padT-padB-h)/2;
            return list.map(x=>{ const o = {...x, y, h:Math.max(x.value*k, 1.5)}; y += x.value*k + gap; return o; }); };
        const L = layout(left), R = layout(right);
        const mh = total*k, my = padT + (H-padT-padB-mh)/2;
        const band = (x0,y0,x1,y1,h)=>{ const xm=(x0+x1)/2; return `M${x0},${y0}C${xm},${y0} ${xm},${y1} ${x1},${y1}L${x1},${y1+h}C${xm},${y1+h} ${xm},${y0+h} ${x0},${y0+h}Z`; };
        const pct = v=> total ? (v/total*100).toFixed(1).replace('.',',')+'%' : '';
        let svg = `<svg class="sankey" viewBox="0 0 ${W} ${H}" role="img" aria-label="Przepływ pieniędzy"><defs>${[...left,...right].filter(x=>x.hatch).map((x,i)=>`<pattern id="hatch-${x.hatch}" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="${x.color}" opacity=".35"/><rect width="3" height="7" fill="${x.color}"/></pattern>`).join('')}</defs>`;
        const fillOf = x=> x.hatch ? `url(#hatch-${x.hatch})` : x.color;
        let acc = my;
        L.forEach(l=>{ svg += `<path class="lnk" d="${band(xL+nodeW, l.y, xM, acc, l.value*k)}" fill="${l.color}" opacity="${l.hatch?.22:.32}"><title>${esc(l.name)} → budżet: ${fmtMoney(l.value,cur)} (${pct(l.value)})</title></path>`; acc += l.value*k; });
        acc = my;
        R.forEach(r=>{ svg += `<path class="lnk" d="${band(xM+nodeW, acc, xR, r.y, r.value*k)}" fill="${r.color}" opacity="${r.hatch?.22:.32}"><title>Budżet → ${esc(r.name)}: ${fmtMoney(r.value,cur)} (${pct(r.value)})</title></path>`; acc += r.value*k; });
        const label = (node, x, anchor)=>{ const cy = node.y + node.h/2;
            return node.h >= 30
                ? `<text x="${x}" y="${cy-3}" text-anchor="${anchor}" font-size="13" font-weight="600">${esc(node.name)}</text><text class="sub num" x="${x}" y="${cy+13}" text-anchor="${anchor}">${fmtMoney(node.value,cur)} · ${pct(node.value)}</text>`
                : `<text x="${x}" y="${cy+4}" text-anchor="${anchor}" font-size="12" font-weight="600">${esc(node.name)} <tspan class="sub" font-weight="400">${fmtMoney(node.value,cur,{compact:true})}</tspan></text>`; };
        L.forEach(l=>{ svg += `<rect x="${xL}" y="${l.y}" width="${nodeW}" height="${l.h}" rx="3" fill="${fillOf(l)}"><title>${esc(l.name)}: ${fmtMoney(l.value,cur)}</title></rect>` + label(l, xL-10, 'end'); });

    function topN(entries, n, otherName){

    function repTop(body, txs, ym){

        ptx.forEach(t=>{
            const raw = (t.description||'').trim(), sn = t.subcategoryName||NO_SUB;
            const key = mode==='desc' ? (raw ? raw.toLowerCase().replace(/\s+/g,' ') : '∅'+sn) : `${t.categoryName}/${sn}`;

        });

        const rows = Object.values(g).map(e=>({name:most(e.names), cat:most(e.cats), sum:e.sum, n:e.n, last:e.last})).sort((a,b)=>b.sum-a.sum).slice(0,10);

        <td class="num">${r.n}</td><td class="num">${fmtMoney(r.sum/r.n)}</td><td class="faint">${fmtShort(r.last)}</td>
        <td><div style="display:flex;align-items:center;gap:10px;justify-content:flex-end"><div class="bar" style="flex:1;max-width:110px"><span style="width:${r.sum/maxV*100}%;background:${catColor(r.cat)}"></span></div><b class="num">${fmtMoney(r.sum)}</b><span class="faint num" style="width:42px">${total?Math.round(r.sum/total*100):0}%</span></div></td></tr>`).join('')}

        });
        $('#p-del').onclick = ()=>{
            const m = openModal({title:'Usunąć konto?', body:`<p class="muted" style="margin-bottom:14px">Twoje konto zostanie trwale usunięte. Wpisz <b>USUŃ</b>, aby potwierdzić.</p><input class="input" id="del-conf">`,
                footer:`<button class="btn btn-ghost" data-close>Anuluj</button><button class="btn btn-danger" id="del-go" disabled>Usuń konto</button>`});
            $('#del-conf',m).oninput = e=>{ $('#del-go',m).disabled = e.target.value.trim().toUpperCase()!=='USUŃ'; };
            $('#del-go',m).onclick = async ()=>{ try { await api('DELETE','/api/users/me'); closeModal(); logout(true, true); toast('Konto usunięte'); } catch(err){ toast(err.message,'err'); } };
        };
    }

    /* =========================================================
       START
       ========================================================= */
    hydrateIcons();
    applyTheme(store.get('bm_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    if (token) boot(); else showAuth('login');
</script>
</body>
</html>
